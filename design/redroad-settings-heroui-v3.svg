<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <style>
    .bg{fill:#0a0a0b}.surface{fill:#18181b}.surface2{fill:#202023}.default{fill:#27272a}.border{stroke:#3f3f46;stroke-width:1}.fg{fill:#f4f4f5}.muted{fill:#a1a1aa}.subtle{fill:#71717a}.primary{fill:#ef3340}.primarySoft{fill:#35191e}.focus{stroke:#ef3340;stroke-width:2;fill:none}.title{font:700 30px 'Noto Sans SC','PingFang SC',sans-serif}.h2{font:600 18px 'Noto Sans SC','PingFang SC',sans-serif}.body{font:400 14px 'Noto Sans SC','PingFang SC',sans-serif}.medium{font:500 14px 'Noto Sans SC','PingFang SC',sans-serif}.small{font:400 12px 'Noto Sans SC','PingFang SC',sans-serif}.label{font:500 11px 'Noto Sans SC','PingFang SC',sans-serif}.tiny{font:500 10px 'Noto Sans SC','PingFang SC',sans-serif}
