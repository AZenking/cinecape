        005 语义保留：applied 只指历史写入；reason=accepted|duplicate|stale_sample|superseded。010 追加独立会话接受
        视图：sessionAccepted/acceptedSampleSeq/acceptedPositionSeconds/acceptedGeneration/sessionStarted；
        superseded 可 sessionAccepted=true/applied=false；duplicate 返回原存储结果不再写；stale_sample
        sessionAccepted=false 并返回最后会话接受游标供恢复。seq 跨 generation 单调。限流 60/min/DeviceSession；
