        只生成有界服务端计划：不建播放/epoch/历史，不占 slot，不测速。计划按设备/Profile/context/来源代次/action 绑定，
        TTL 60s 固定；倒计时开始前取计划，选择历史时使用同一快照，超期 410 NEXT_PLAN_EXPIRED 并重新展示。每设备最多
        20 活计划，按最早过期淘汰。限流沿用过渡 10/min/DeviceSession；写 body<=16KiB；no-store。
      x-access: playback
