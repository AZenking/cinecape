        - $ref: '#/components/parameters/IntentIdPath'
  /playback/transition-intents/{intentId}/cleanup:
    post:
      operationId: vod_cleanupTransitionIntent
      summary: vodCleanupTransitionIntent
      description: >-
        body={}。200 {outcome:cancelled|already_cancelled|cleanup_pending|stopped}。仅清理授权分支（I5）：仅当前有效
        DeviceSession、原 Profile 及完全相同 contextVersion 可用；跨家庭/设备/Profile/旧 context 及不存在均 404。该
        分支不要求源或目标当前内容策略放行，不返回目标 ID、元数据、位置或票据；不写 final/history、不重建、不重消费。
        事务内 pending 则取消/释放槽，consumed 则为唯一已关联后继写持久 cleanup_requested 并拒绝其 renew/新资产、投递
        幂等空 stop；已终态仍清理资源。失败/重启扫描重试；GET 完整结果被拒或响应丢失时重试同入口；不依赖已知
        successorSessionId。context 变更后禁止调用（由撤销处理与持久 cleanup 扫描负责）；不能放宽原 stop/control 鉴权。
        写 body<=16KiB。
      x-access: playback
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionCleanupReply'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyActionRequest'
      parameters:
        - $ref: '#/components/parameters/IntentIdPath'
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: >-
            公开稳定错误码；010 新增 VOD_SEARCH_EXPIRED(410)/VOD_PREVIEW_EXPIRED(410)/VOD_DETAIL_CHANGED(409)/
            VOD_MATERIALIZATION_STALE(409)/VOD_QUOTA_EXCEEDED(409)/IDEMPOTENCY_CONFLICT(409)/
            TRANSITION_SLOT_CONFLICT(409)/TRANSITION_EXPIRED(410)/NEXT_PLAN_CHANGED(409)/NEXT_PLAN_EXPIRED(410)/
            VOD_NEXT_UNAVAILABLE(404)/SOURCE_PROGRESS_PENDING(409)/SOURCE_NOT_TERMINAL(409)/
            FINISH_ALREADY_RECORDED(409)/VOD_EPISODE_REQUIRED(400)，并继承 004/005 既有码。
      required:
        - title
        - status
        - code
    PublicVodCard:
      type: object
      additionalProperties: false
      description: 公共 VOD 卡片；无源配置 ID。
      required:
        - titleRef
        - title
        - year
        - sourceLabel
        - posterRef
      properties:
        titleRef:
          type: string
          minLength: 1
          description: 不透明标题引用；不得携带可解码的上游 URL。
        title:
          type: string
        year:
          type:
            - string
            - 'null'
        sourceLabel:
          type: string
        posterRef:
          type:
            - string
            - 'null'
          minLength: 1
          description: 同源海报资源不透明引用（经 /public/vod/posters/{posterRef} 服务端代理取回）；上游未给海报 → null。不得携带可解码的上游地址。
    VodSearchSource:
      type: object
      additionalProperties: false
      required:
        - sourceRef
        - status
        - hasMore
      properties:
        sourceRef:
          type: string
          minLength: 1
          description: 不透明来源引用；无源配置 ID。
        status:
          type: string
          enum:
            - ok
            - empty
            - timeout
            - invalid
            - unavailable
        hasMore:
          type: boolean
    SearchPage:
      type: object
      additionalProperties: false
      description: 搜索页；已生成页重放不变，未抓取实时上游不承诺完整快照。
      required:
        - searchId
        - items
        - sources
        - nextCursor
        - partial
        - reasons
        - expiresAt
      properties:
        searchId:
          type: string
          minLength: 1
          description: 不透明搜索 ID；10min/最多 2000 结果。
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PublicVodCard'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/VodSearchSource'
        nextCursor:
          type:
            - string
            - 'null'
        partial:
          type: boolean
          description: 正常 next 页 partial=false；部分源失败/超时为 true 并填 reasons。
        reasons:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    VodPreviewEpisode:
      type: object
      additionalProperties: false
      required:
        - episodeRef
        - label
        - status
        - reason
      properties:
        episodeRef:
          type: string
          minLength: 1
          description: 不透明集引用；不得携带可解码的上游 URL。
        label:
          type: string
        status:
          type: string
          enum:
            - candidate
            - unsupported
        reason:
          type:
            - string
            - 'null'
          enum:
            - identity_ambiguous
            - format_unsupported
            - null
    VodPreviewLine:
      type: object
      additionalProperties: false
      required:
        - lineRef
        - name
        - episodes
      properties:
        lineRef:
          type: string
          minLength: 1
        name:
          type: string
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/VodPreviewEpisode'
    VodPreview:
      type: object
      additionalProperties: false
      description: >-
        预览快照；预算最多 20 线路/单线 2000 集/合计 5000 集/4MiB，超体积与超条目一律 422 整次失败。预览不物化、
        不建个人记录。
      required:
        - titleRef
        - title
        - description
        - year
        - sourceLabel
        - posterRef
        - previewRevision
        - fetchedAt
        - expiresAt
        - lines
      properties:
        titleRef:
          type: string
          minLength: 1
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        year:
          type:
            - string
            - 'null'
        sourceLabel:
          type: string
        posterRef:
          type:
            - string
            - 'null'
          minLength: 1
          description: 同源海报资源不透明引用（与卡片 posterRef 同值；经 /public/vod/posters/{posterRef} 服务端代理取回）；上游未给海报 → null。
        previewRevision:
          type: integer
          minimum: 1
        fetchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lines:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VodPreviewLine'
    TitleEpisodeMaterializationRequest:
      type: object
      additionalProperties: false
      description: 标题/集分支；titleRef+episodeRef 均来自当前有效预览。
      required:
        - titleRef
        - episodeRef
        - previewRevision
        - operationKey
      properties:
        titleRef:
          type: string
          minLength: 1
        episodeRef:
          type: string
          minLength: 1
        previewRevision:
          type: integer
          minimum: 1
        operationKey:
          type: string
          format: uuid
    CandidateMaterializationRequest:
      type: object
      additionalProperties: false
      description: >-
        候选分支（I1）；candidateRef 为服务端签发的不透明候选引用，服务端记录绑定家庭/原设备/Profile/context/来源
        session/generation/预览修订与准确 title/episode 键；不要求前端推导 titleRef/episodeRef。
      required:
        - candidateRef
        - previewRevision
        - operationKey
      properties:
        candidateRef:
          type: string
          minLength: 1
        previewRevision:
          type: integer
          minimum: 1
        operationKey:
          type: string
          format: uuid
    MaterializationRequest:
      oneOf:
        - $ref: '#/components/schemas/TitleEpisodeMaterializationRequest'
        - $ref: '#/components/schemas/CandidateMaterializationRequest'
    Materialized:
      type: object
      additionalProperties: false
      description: >-
        revision 为提交时值，不表示当前仍未变化。candidate 分支返回不可变的已登记映射引用 registeredCandidateRef
        （intent.targetCandidateRef 使用它，previewRevision 仍须匹配）；普通分支两者为 null。
      required:
        - parentMediaId
        - mediaId
        - detailRevision
        - catalogRevision
        - replayed
        - candidateRef
        - registeredCandidateRef
      properties:
        parentMediaId:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        detailRevision:
          type: integer
          minimum: 1
        catalogRevision:
          type: integer
          minimum: 1
        replayed:
          type: boolean
        candidateRef:
          type:
            - string
            - 'null'
        registeredCandidateRef:
          type:
            - string
            - 'null'
    StableEpisodeItem:
      type: object
      additionalProperties: false
      required:
        - mediaId
        - label
        - availability
        - sequenceOrdinal
      properties:
        mediaId:
          type: string
          format: uuid
        label:
          type: string
        availability:
          type: string
          enum:
            - candidate
            - unavailable
        sequenceOrdinal:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 确定序列序号；ambiguous/special 或缺序为 null。
    StableEpisodeLine:
      type: object
      additionalProperties: false
      required:
        - lineRef
        - name
        - episodes
      properties:
        lineRef:
          type: string
          minLength: 1
        name:
          type: string
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/StableEpisodeItem'
    StableEpisodes:
      type: object
      additionalProperties: false
      description: >-
        稳定分页；修订绑定 cursor，详情变化 409 VOD_DETAIL_CHANGED。线路可跨页重复，消费者按 lineRef 聚合，不能把每页
        线路当新线；每页总计 100 子项。稳定详情失败可返回旧完整快照+stale=true；成功明确删除不能 stale 复活。
      required:
        - parentMediaId
        - detailRevision
        - fetchedAt
        - stale
        - lines
        - nextCursor
      properties:
        parentMediaId:
          type: string
          format: uuid
        detailRevision:
          type: integer
          minimum: 1
        fetchedAt:
          type: string
          format: date-time
        stale:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/StableEpisodeLine'
        nextCursor:
          type:
            - string
            - 'null'
    HistorySummary:
      type: object
      additionalProperties: false
      description: >-
        在线媒体历史摘要；canAttemptResume 仅候选资格，最终续播资格在本次 resolve/probe 后由 startBasis/
        resumeDisposition 判定，finish/auto-next 资格由尾段观测在 finish 时独立判定，三者互不替代。
      required:
        - mediaId
        - parentMediaId
        - lineLabel
        - episodeLabel
        - lastViewedAt
        - positionSeconds
        - durationSeconds
        - completed
        - canAttemptResume
        - resumeReason
        - resumeConfidence
        - revision
      properties:
        mediaId:
          type: string
          format: uuid
        parentMediaId:
          type: string
          format: uuid
        lineLabel:
          type: string
        episodeLabel:
          type: string
        lastViewedAt:
          type: string
          format: date-time
        positionSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        completed:
          type: boolean
        canAttemptResume:
          type: boolean
        resumeReason:
          type:
            - string
            - 'null'
          enum:
            - unavailable
            - content_changed
            - continuity_changed
            - completed
            - invalid_position
            - duration_unknown
            - null
        resumeConfidence:
          type: string
          enum:
            - operational
            - verified
            - none
        revision:
          type: integer
          minimum: 1
    NextEpisodeAction:
      type: object
      additionalProperties: false
      required:
        - mediaId
        - label
      properties:
        mediaId:
          type: string
          format: uuid
        label:
          type: string
    TitleProgress:
      type: object
      additionalProperties: false
      description: >-
        无记录三个 null；latest 取最近实际记录；resumeCandidate 取最近未完成且可候选的本 Profile 子项，无适合项 null；
        下一集 action 来自 latest 的确定序列，不自动播放。
      required:
        - latest
        - resumeCandidate
        - nextEpisodeAction
      properties:
        latest:
          oneOf:
            - $ref: '#/components/schemas/HistorySummary'
            - type: 'null'
        resumeCandidate:
          oneOf:
            - $ref: '#/components/schemas/HistorySummary'
            - type: 'null'
        nextEpisodeAction:
          oneOf:
            - $ref: '#/components/schemas/NextEpisodeAction'
            - type: 'null'
    Preferences:
      type: object
      additionalProperties: false
      required:
        - autoplayNext
        - switchCarryPosition
        - version
      properties:
        autoplayNext:
          type: boolean
        switchCarryPosition:
          type: boolean
        version:
          type: integer
          minimum: 0
          description: 未有持久行时传输初值 0；持久行 version>=1，服务端绝不写入 0 作为持久版本。
    VodPreferencesPatchRequest:
      type: object
      additionalProperties: false
      description: 至少一个偏好字段；expectedVersion 为读到的 Preferences.version（未有行=0）。
      required:
        - expectedVersion
        - operationKey
      anyOf:
        - required:
            - autoplayNext
        - required:
            - switchCarryPosition
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        autoplayNext:
          type: boolean
        switchCarryPosition:
          type: boolean
        operationKey:
          type: string
          format: uuid
    ProgressSample:
      type: object
      additionalProperties: false
      description: 与 005 同形；seq 跨 generation 单调。
      required:
        - sampleSeq
        - expectedGeneration
        - positionSeconds
        - reason
      properties:
        sampleSeq:
          type: integer
          minimum: 1
        expectedGeneration:
          type: integer
          minimum: 1
        positionSeconds:
          type: number
          minimum: 0
        reason:
          type: string
          enum:
            - started
            - periodic
            - pause
    ProgressReply:
      type: object
      additionalProperties: false
      description: >-
        applied 保留旧义（只指历史写入）。superseded 可 sessionAccepted=true/applied=false；duplicate 返回原存储结果
        不再次写；stale_sample sessionAccepted=false 并返回最后会话接受游标（acceptedSampleSeq/acceptedGeneration/
        acceptedPositionSeconds）供恢复。
      required:
        - applied
        - reason
        - historyRevision
        - sessionAccepted
        - acceptedSampleSeq
        - acceptedPositionSeconds
        - acceptedGeneration
        - sessionStarted
      properties:
        applied:
          type: boolean
        reason:
          type: string
          enum:
            - accepted
            - duplicate
            - stale_sample
            - superseded
        historyRevision:
          type:
            - integer
            - 'null'
          minimum: 1
        sessionAccepted:
          type: boolean
        acceptedSampleSeq:
          type: integer
          minimum: 1
        acceptedPositionSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        acceptedGeneration:
          type: integer
          minimum: 1
        sessionStarted:
          type: boolean
    FinalProgress:
      type: object
      additionalProperties: false
      required:
        - sampleSeq
        - expectedGeneration
        - positionSeconds
      properties:
        sampleSeq:
          type: integer
          minimum: 1
        expectedGeneration:
          type: integer
          minimum: 1
        positionSeconds:
          type: number
          minimum: 0
    FinishRequest:
      type: object
      additionalProperties: false
      description: finish operationKey 必须为 UUID；同 operationKey 异 payload 409。
      required:
        - operationKey
        - finalProgress
        - cause
      properties:
        operationKey:
          type: string
          format: uuid
        finalProgress:
          $ref: '#/components/schemas/FinalProgress'
        cause:
          type: string
          enum:
            - natural_end
    FinishReceipt:
      type: object
      additionalProperties: false
      description: >-
        没有权限不返回 receipt；session 只有一份不可变 finish 结果。无证据不等于接口失败（可 ended=true/
        autoNextEligible=false）；旧 stop 先赢时首次 finish 只登记 stopped_elsewhere receipt 而不写新 final。
      required:
        - sessionId
        - generation
        - ended
        - finalSessionAccepted
        - historyApplied
        - historyRevision
        - sessionCompleted
        - autoNextEligible
        - reason
        - positionSeconds
        - durationSeconds
        - endedAt
        - replayed
      properties:
        sessionId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        ended:
          type: boolean
        finalSessionAccepted:
          type: boolean
        historyApplied:
          type: boolean
        historyRevision:
          type:
            - integer
            - 'null'
          minimum: 1
        sessionCompleted:
          type: boolean
        autoNextEligible:
          type: boolean
        reason:
          type: string
          enum:
            - completed
            - stale_final
            - no_tail_observation
            - not_started
            - no_duration
            - not_completed
            - stopped_elsewhere
        positionSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        endedAt:
          type: string
          format: date-time
          description: 旧 stop 先赢时取原终态时刻。
        replayed:
          type: boolean
    StopRequest:
      type: object
      additionalProperties: false
      description: 保留 005 body 及行为；仍 204 无 body。
      properties:
        finalProgress:
          $ref: '#/components/schemas/FinalProgress'
      required: []
    ObservationSample:
      type: object
      additionalProperties: false
      description: 播放观测；不写个人历史/epoch；每 session 最高 2Hz。
      required:
        - eventSeq
        - expectedGeneration
        - event
        - positionSeconds
        - playbackRate
      properties:
        eventSeq:
          type: integer
          minimum: 1
          description: 每 generation 独立。
        expectedGeneration:
          type: integer
          minimum: 1
        event:
          type: string
          enum:
            - playing
            - pause
            - seeking
            - seeked
            - waiting
            - ratechange
            - error
        positionSeconds:
          type: number
          minimum: 0
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 2
    ObservationReply:
      type: object
      additionalProperties: false
      description: >-
        playbackStarted=true 表示已接受 playing 观测并原子设置独立 playback_started_at：仅解除 readyAt+60s 未起播
        期限，不设置 sessionStarted、不写 ledger/history、不授予完成/carry 资格；无 playing/无交付、仅 heartbeat/
        renew 不解除期限。
      required:
        - accepted
        - lastEventSeq
        - playbackStarted
      properties:
        accepted:
          type: boolean
          description: 同 seq 同载荷重放返回原结果；陈旧样本 accepted=false。
        lastEventSeq:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 当前已接受最大 eventSeq；尚无接受事件为 null。
        playbackStarted:
          type: boolean
    NextPlanRequest:
      type: object
      additionalProperties: false
      description: 只生成有界服务端计划；不建播放/epoch/历史，不占 slot，不测速。
      required:
        - fromSessionId
        - expectedGeneration
        - action
      properties:
        fromSessionId:
          type: string
          format: uuid
        expectedGeneration:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - next
            - manual_next
    NextPlanReply:
      type: object
      additionalProperties: false
      description: >-
        服务端确定的下一集计划快照；TTL 60s 固定（expiresAt），倒计时开始前取计划，选择历史时使用同一快照；超期 410
        NEXT_PLAN_EXPIRED。historyChoiceRequired=true 仅表示 UI 必须显式选择后才可提交 intent，不构成授权。
      required:
        - nextPlanRef
        - targetMediaId
        - label
        - sequenceRevision
        - detailRevision
        - historyRevision
        - historyChoiceRequired
        - history
        - expiresAt
      properties:
        nextPlanRef:
          type: string
          minLength: 1
          description: 不透明计划引用；绑定服务端确定的目标、序列/详情修订及目标历史 revision。
        targetMediaId:
          type: string
          format: uuid
        label:
          type: string
        sequenceRevision:
          type: integer
          minimum: 1
        detailRevision:
          type: integer
          minimum: 1
        historyRevision:
          type: integer
          minimum: 0
          description: 目标历史 revision 快照；无历史=0（仅快照语义，非持久历史 revision）。
        historyChoiceRequired:
          type: boolean
        history:
          oneOf:
            - $ref: '#/components/schemas/HistorySummary'
            - type: 'null'
        expiresAt:
          type: string
          format: date-time
    SequentialNextIntentRequest:
      type: object
      additionalProperties: false
      description: >-
        next/manual_next 分支：不接受 historyChoiceConfirmed 或客户端目标 ID。nextPlanRef 绑定服务端确定的目标、
        序列/详情修订及目标历史 revision；positionMode 表示用户对该快照的位置选择。自动 next 要求 finish 资格和当前
        偏好；manual_next 不要求偏好/完成。创建及消费均验证计划：目标/序列或目标历史变化 409 NEXT_PLAN_CHANGED。
      required:
        - fromSessionId
        - expectedGeneration
        - action
        - nextPlanRef
        - positionMode
        - expectedSlotRevision
        - operationKey
      properties:
        fromSessionId:
          type: string
          format: uuid
        expectedGeneration:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - next
            - manual_next
        nextPlanRef:
          type: string
          minLength: 1
        positionMode:
          type: string
          enum:
            - beginning
            - target_history
        expectedSlotRevision:
          type: integer
          minimum: 0
          description: 客户端持有的 transitionSlot.revision（无持久行=0）。
        operationKey:
          type: string
          format: uuid
    SourceCheckpoint:
      type: object
      additionalProperties: false
      description: >-
        carry 的冻结来源游标；事务读取的当前代 ledger 必须精确等于该游标，否则 409 SOURCE_PROGRESS_PENDING。未接受
        样本不作为 checkpoint；ledger 已前进则重新展示/确认，不自动挑另一个旧位置。
      required:
        - expectedGeneration
        - sampleSeq
      properties:
        expectedGeneration:
          type: integer
          minimum: 1
        sampleSeq:
          type: integer
          minimum: 1
    SwitchIntentRequest:
      type: object
      additionalProperties: false
      description: >-
        switch/recover_switch 分支。target 必须可验证候选（registeredCandidateRef，previewRevision 仍须匹配；目标需
        物化先调用 materializations；intent 只接受已登记目标的候选映射）。high 可 carry；ambiguous 需
        confirmedAmbiguous=true 且具体候选集；conflict 只 beginning/target_history 且不能继承源位置。若目标需物化先
        调用 materializations。carry 必须提供 sourceCheckpoint、不接用户 position；beginning/target_history 禁止
        sourceCheckpoint 与 allowEarlierAcceptedPosition 字段。pause 丢响应先按原 seq/载荷重试恢复。
      required:
        - fromSessionId
        - expectedGeneration
        - action
        - targetCandidateRef
        - previewRevision
        - positionMode
        - confirmedAmbiguous
        - expectedSlotRevision
        - operationKey
      properties:
        fromSessionId:
          type: string
          format: uuid
        expectedGeneration:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - switch
            - recover_switch
        targetCandidateRef:
          type: string
          minLength: 1
        previewRevision:
          type: integer
          minimum: 1
        positionMode:
          type: string
          enum:
            - carry
            - target_history
            - beginning
        confirmedAmbiguous:
          type: boolean
        sourceCheckpoint:
          $ref: '#/components/schemas/SourceCheckpoint'
        allowEarlierAcceptedPosition:
          type: boolean
          description: >-
            用户明确确认已显示的接受游标后以新 operationKey、该游标及 true 提交；仍须精确相等；不自动挑另一个旧位置。
        expectedSlotRevision:
          type: integer
          minimum: 0
        operationKey:
          type: string
          format: uuid
      allOf:
        - if:
            type: object
            properties:
              positionMode:
                const: carry
            required:
              - positionMode
            additionalProperties: false
          then:
            required:
              - sourceCheckpoint
        - if:
            type: object
            properties:
              positionMode:
                enum:
                  - beginning
                  - target_history
            required:
              - positionMode
            additionalProperties: false
          then:
            not:
              anyOf:
                - required:
                    - sourceCheckpoint
                - required:
                    - allowEarlierAcceptedPosition
    IntentRequest:
      oneOf:
        - $ref: '#/components/schemas/SequentialNextIntentRequest'
        - $ref: '#/components/schemas/SwitchIntentRequest'
    IntentReply:
      type: object
      additionalProperties: false
      description: >-
        不返回原始地址；消费前不返回播放票（发票仍走 renew）。TTL 60s 自 createdAt 固定计时，重放不续 TTL；已消费不按
        TTL 丢重放映射，至少 24h 保留。
      required:
        - id
        - fromSessionId
        - fromGeneration
        - action
        - targetMediaId
        - positionMode
        - matchConfidence
        - slotRevision
        - status
        - expiresAt
        - successorSessionId
      properties:
        id:
          type: string
          format: uuid
        fromSessionId:
          type: string
          format: uuid
        fromGeneration:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - next
            - manual_next
            - switch
            - recover_switch
        targetMediaId:
          type: string
          format: uuid
        positionMode:
          type: string
          enum:
            - beginning
            - target_history
            - carry
        matchConfidence:
          type: string
          enum:
            - high
            - ambiguous
            - conflict
        slotRevision:
          type: integer
          minimum: 1
          description: intent 绑定的 slot revision；持久行 revision>=1。
        status:
          type: string
          enum:
            - pending
            - cancelled
            - superseded
            - expired
            - consumed
        expiresAt:
          type: string
          format: date-time
        successorSessionId:
          type:
            - string
            - 'null'
          format: uuid
          description: 消费前 null。
    TransitionCancelReply:
      type: object
      additionalProperties: false
      required:
        - outcome
        - successorSessionId
        - slotRevision
      properties:
        outcome:
          type: string
          enum:
            - cancelled
            - already_cancelled
            - superseded
            - expired
            - already_consumed
        successorSessionId:
          type:
            - string
            - 'null'
          format: uuid
          description: 取消输给消费时返回原后继引用（仅原上下文可见）。
        slotRevision:
          type: integer
          minimum: 1
    TransitionCleanupReply:
      type: object
      additionalProperties: false
      description: 仅清理分支的最小结果；不返回目标 ID、元数据、位置或票据。
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - cancelled
            - already_cancelled
            - cleanup_pending
            - stopped
    VodResolveRequest:
      oneOf:
        - $ref: '#/components/schemas/VodResolveBasisRequest'
        - $ref: '#/components/schemas/VodResolveTransitionRequest'
    VodResolveBasisRequest:
      type: object
      additionalProperties: false
      description: 基础分支；startMode 缺省 beginning。resume 仅点播；频道请求 resume 沿用 004/005 400。
      required:
        - mediaId
      properties:
        mediaId:
          type: string
          format: uuid
          description: 目标媒体标识；不可见媒体（被禁/跨家庭/无源）与不存在同形 404。
        startMode:
          type: string
          enum:
            - beginning
            - resume
          default: beginning
    VodResolveTransitionRequest:
      type: object
