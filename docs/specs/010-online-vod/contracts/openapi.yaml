        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMedia'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    HistoryItem:
      type: object
      additionalProperties: false
      description: 005 HistoryItem + 010 扩展 resumeCheckRequired（仅在线媒体为 true）。
      required:
        - media
        - lastViewedAt
        - positionSeconds
        - durationSeconds
        - canResume
        - revision
      properties:
        media:
          $ref: '#/components/schemas/PublicMedia'
        lastViewedAt:
          type: string
          format: date-time
        positionSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        canResume:
          type: boolean
          description: >-
            005 语义（静态媒体原义不变）；对在线媒体映射为候选资格并追加 resumeCheckRequired=true。
        resumeCheckRequired:
          type: boolean
          description: 010 扩展；在线媒体候选资格标记，最终资格需当次 resolve/probe 判定；静态媒体不返回。
        revision:
          type: integer
          minimum: 1
    HistoryPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          type:
            - string
            - 'null'
    PlaybackSessionState:
      type: string
      description: 004/005 播放会话状态机（不新增 completed 播放状态；完成资格在 finish receipt）。
      enum:
        - preparing
        - ready
        - playing
        - paused
        - ended
        - failed
        - interrupted
    PlaybackDelivery:
      type:
        - string
        - 'null'
      description: 004/005 交付模式；探测/格式计划完成前为 null。
      enum:
        - direct
        - hls_proxy
        - remux
        - audio_transcode
        - video_transcode
        - null
    PlaybackTrackAudio:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - language
        - default
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
        language:
          type: string
        default:
          type: boolean
    PlaybackTrackSubtitle:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - language
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
        language:
          type: string
    PlaybackTracks:
      type: object
      additionalProperties: false
      description: 探测未完成时 audio/subtitles 均为空数组。
      required:
        - audio
        - subtitles
      properties:
        audio:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackTrackAudio'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackTrackSubtitle'
    TransitionSlot:
      type: object
      additionalProperties: false
      description: >-
        供当前归属设备恢复/替换；首次槽不存在 revision=0/open（传输初值），任何持久行 revision>=1。
      required:
        - revision
        - status
        - activeIntentId
        - successorSessionId
      properties:
        revision:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - open
            - reserved
            - consumed
        activeIntentId:
          type:
            - string
            - 'null'
          format: uuid
        successorSessionId:
          type:
            - string
            - 'null'
          format: uuid
    PlaybackDto:
      type: object
      additionalProperties: false
      description: >-
        继承 004/005 状态 DTO（B004PlaybackDto 同形），无新增源 URL；010 追加 startBasis/resumeDisposition/
        resumeReason/transitionSlot/seekCapability/playbackStarted。票字段仍只有 renew 返回，普通 GET/resolve 不发票。
        preparing 未冻结时 resumeDisposition=pending。
      required:
        - id
        - state
        - version
        - generation
        - desiredPaused
        - delivery
        - positionSeconds
        - durationSeconds
        - timelineOffsetSeconds
        - presentationStartSeconds
        - ticketExpiresAt
        - playbackUrl
        - tracks
        - startBasis
        - resumeDisposition
        - resumeReason
        - transitionSlot
        - seekCapability
        - playbackStarted
      properties:
        id:
          type: string
          format: uuid
          description: 播放会话 ID。
        state:
          $ref: '#/components/schemas/PlaybackSessionState'
        version:
          type: integer
          minimum: 1
          description: 会话编辑 version（CAS 依据）。
        generation:
          type: integer
          minimum: 1
          description: 会话编辑代次；旧代次票立即失效。
        desiredPaused:
          type: boolean
        delivery:
          $ref: '#/components/schemas/PlaybackDelivery'
        positionSeconds:
          type: number
          minimum: 0
          description: 当前/目标播放位置（影片逻辑时间，秒）。
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: 影片逻辑时长（秒）；直播/未知为 null，未知时长可播放但不承诺进度/续播。
        timelineOffsetSeconds:
          type: number
        presentationStartSeconds:
          type: number
          minimum: 0
          description: 冻结起点；续播/carry/client seek 定位的逻辑输出 offset。
        ticketExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 除 renew 响应外为 null。
        playbackUrl:
          type:
            - string
            - 'null'
          description: 除 renew 响应外为 null；同源相对路径，无源地址。
        tracks:
          $ref: '#/components/schemas/PlaybackTracks'
        failureCode:
          type: string
          description: 公开稳定失败码；仅 state=failed 时出现且非空，含 010 新注册码；不含源诊断。
        startBasis:
          type: string
          enum:
            - beginning
            - target_history
            - transition_carry
          description: 010 扩展；intent.positionMode 映射唯一 startBasis，禁止第二次 resume 覆盖 carry。
        resumeDisposition:
          type: string
          enum:
            - pending
            - resume
            - beginning
          description: 010 扩展；preparing 未冻结=pending；probe 后一次计算并冻结。
        resumeReason:
          type:
            - string
            - 'null'
          enum:
            - accepted
            - requested_beginning
            - no_history
            - content_changed
            - continuity_changed
            - duration_changed
            - completed
            - invalid_position
            - duration_unknown
            - null
          description: 010 扩展；降级从头时给出具体原因，旧历史保留直到新的有效 started。
        transitionSlot:
          $ref: '#/components/schemas/TransitionSlot'
        seekCapability:
          type: string
          enum:
            - none
            - client
            - server_rebuild
          description: >-
            010 扩展（U2）；由可信 probe/交付与可用 seek 范围产生。hls_proxy VOD 第一期仅 client 或 none，保留现有
            POST seek 拒绝 hls_proxy；直播 none。client=许可声明，前端还须检查实际 seekable 范围；能力/范围不满足时
            不显示可用拖动入口。
        playbackStarted:
          type: boolean
          description: >-
            010 扩展（I4）；独立 playback_started_at 已设置。仅解除未起播回收期限，与 sessionStarted/saved/completed
            分别记录。
  responses:
    BadRequest400:
      description: >-
        400 VALIDATION_FAILED —— JSON 语法错误/未知字段拒绝/非有限数值/超范围/互斥参数同给/请求体超过 16KiB；
        resolve 父项在身份/策略检查后 400 VOD_EPISODE_REQUIRED；非父媒体 episodes 400。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    Unauthorized401:
      description: 401 SESSION_INVALID —— 认证失败（无会话/失效/设备撤销）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    ProfileForbidden403:
      description: 403 ACTIVE_PROFILE_REQUIRED —— 无当前有效 Profile；不返回策略明细。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    SettingsForbidden403:
      description: >-
        403 Settings guard 未通过/设置 PIN 缺失（SETTINGS_PIN_REQUIRED/SETTINGS_ACCESS_REQUIRED）；013(ADR-0017/FR-005)起
        本组端点免当次密码，不再出现 PARENT_VERIFICATION_*；授权错误不包装为测试结果。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    NotFound404:
      description: >-
        404 —— 不存在/跨家庭/跨设备/非本设备会话/旧上下文（A→B→A 的 contextVersion 不等）/策略拒绝媒体/候选绑定
        冲突统一同形，不泄露存在性与原因差异。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    Locked423:
      description: 423 —— PIN/密码验证锁定窗口内。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    RateLimited429:
      description: >-
        429 —— 超出对应桶（公共 120/min/IP、在线搜索另 20/min/IP、phase 观测 120/min/session、progress
        60/min/DeviceSession、intent/测速/next-plans 10/min/DeviceSession、resolve/控制沿用 004 桶）；所有桶有 TTL
        与全局数量上限，资源忙返回 429 不堆无界队列；超缓存/工作队列上限明确 429。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfterSeconds'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    StorageNotReady503:
      description: 503 —— 存储代际不支持/策略损坏/依赖未就绪。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    UpstreamFailed502:
      description: 502 —— 搜索全源失败等上游失败；详细上游错误/地址/凭据不公开。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    GatewayTimeout504:
      description: 504 —— 上游全部超时/总期限超限。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodSearchExpired410:
      description: 410 VOD_SEARCH_EXPIRED —— 搜索/游标失效；保留 q 重新搜索。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodPreviewExpired410:
      description: 410 VOD_PREVIEW_EXPIRED —— 预览/候选引用过期；重新预览；新 key 不得使用过期原候选。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodDetailTooLarge422:
      description: 422 —— 详情/预览超体积（4MiB）与超条目（20 线路/单线 2000/合计 5000）一律整次失败。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodDetailChanged409:
      description: 409 VOD_DETAIL_CHANGED —— 详情/预览修订变化；重读并明确重选，不复用旧位置。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodMaterializationConflict409:
      description: >-
        409 IDEMPOTENCY_CONFLICT（同 key 异摘要）/ VOD_DETAIL_CHANGED（新操作预览变化）/ VOD_QUOTA_EXCEEDED（满额，
        管理来源/配额、不删除个人历史）/ VOD_MATERIALIZATION_STALE（旧结果目标内容/连续性变化）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodQuotaExceeded409:
      description: 409 VOD_QUOTA_EXCEEDED —— 启用源满 10 个等净配额超限；管理来源/配额，不删除个人历史。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodPreferencesConflict409:
      description: 409 VERSION_CONFLICT（CAS expectedVersion 不符）或 IDEMPOTENCY_CONFLICT（同 operationKey 异摘要）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    StateConflict409:
      description: 409 —— VERSION_CONFLICT/状态冲突（如来源 CAS expectedVersion 不符）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    VodNextUnavailable404:
      description: 404 VOD_NEXT_UNAVAILABLE —— 无确定下一集，停止连播。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    NextPlanChanged409:
      description: >-
        409 NEXT_PLAN_CHANGED —— 序列/详情/目标历史与计划快照不一致；重新取计划、展示目标及历史并重新确认，不重新
        计算后静默消费，不消耗槽且不建后继。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    NextPlanExpired410:
      description: >-
        410 NEXT_PLAN_EXPIRED —— 计划超期（TTL 60s）；重新取计划、展示目标及历史并重新确认；不自动携带过期 carry。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    TransitionIntentConflict409:
      description: >-
        409 TRANSITION_SLOT_CONFLICT（slot 重放以 (operationKey,digest) 幂等：同 key 重放返回原结果不续 TTL，
        consumed 槽任何新 key 409 并附原后继引用）/ NEXT_PLAN_CHANGED / SOURCE_PROGRESS_PENDING /
        IDEMPOTENCY_CONFLICT（同 operationKey 异摘要）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    TransitionExpired410:
      description: >-
        410 TRANSITION_EXPIRED —— intent 未消费过期（TTL 60s 自 createdAt 固定计时）；用户重新发起，不误作可重新
        消费，不自动携带过期 carry。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    ResolveConflict409:
      description: >-
        409 —— 过渡消费：SOURCE_NOT_TERMINAL（来源未终态，不消耗 intent）/ SOURCE_PROGRESS_PENDING（冻结 ledger
        与游标不精确相等）/ NEXT_PLAN_CHANGED（计划快照变化）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    ProgressConflict409:
      description: >-
        409 —— 既有码：PLAYBACK_GENERATION_STALE / PROGRESS_SAMPLE_CONFLICT（同 seq 异 payload，不消耗 seq）/
        PROGRESS_RESOURCE_CHANGED / PROGRESS_NOT_READY；重新读取会话/重建播放，禁止篡改重试原载荷。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    FinishConflict409:
      description: >-
        409 —— FINISH_ALREADY_RECORDED（已有 receipt 且新 key 不同，附恢复路径而不重算）/ 同 operationKey 异
        digest / PLAYBACK_GENERATION_STALE / PROGRESS_SAMPLE_CONFLICT / PROGRESS_RESOURCE_CHANGED；硬非法整次
        回滚，不部分终态化。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
    ObservationConflict409:
      description: 409 —— 同 eventSeq 异载荷冲突（不写）；重新按服务端事实对齐后上报。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: 播放会话 ID；跨设备/跨家庭访问统一 404 同形。
      schema:
        type: string
        format: uuid
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ParentIdPath:
      name: parentId
      in: path
      required: true
      description: VOD 父标题媒体 ID；不存在/跨家庭 404。
      schema:
        type: string
        format: uuid
    SourceIdPath:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TitleRefPath:
      name: titleRef
      in: path
      required: true
      description: 不透明标题引用；不得携带可解码的上游 URL；失效 410、伪造/跨家庭 404。
      schema:
        type: string
        minLength: 1
    IntentIdPath:
      name: intentId
      in: path
      required: true
      description: 过渡意图 ID；跨上下文/不存在 404，过期未消费 410。
      schema:
        type: string
        format: uuid
  headers:
    CacheControlNoStore:
      description: 所有响应（含错误）禁止缓存/公开缓存。
      schema:
        type: string
        const: no-store
    ReferrerPolicyNoReferrer:
      description: 播放/私密相关响应不向第三方发送 referrer。
      schema:
        type: string
        const: no-referrer
    RetryAfterSeconds:
      description: 限流（429）后建议等待的秒数。
      schema:
        type: integer
        minimum: 1
    LocationPlaybackSession:
      description: 新建播放会话地址（同源相对路径，如 /api/playback/sessions/{sessionId}）。
      schema:
        type: string
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
      description: >-
        浏览器同源 httpOnly 设备会话 Cookie（沿用 001/005）；写操作须同源 Origin/CSRF/JSON 校验；公共读取不根据
        cookie 过滤内容、不设置身份 cookie。
    SessionBearer:
      type: http
      scheme: bearer
      description: 不透明设备会话令牌（仅签发时返回一次）；Bearer 客户端逐请求携带原认证。
