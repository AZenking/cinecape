      description: >-
        过渡消费分支；禁止 startMode 字段（严格 oneOf，不得与基础分支混用）。intent.positionMode 映射唯一 startBasis；
        相同已消费 intent 重放返回 200 同后继当前状态。
      required:
        - mediaId
