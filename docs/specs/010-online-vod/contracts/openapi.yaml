      description: >-
        Profile/授权/交付/phase 检查；观测不写历史/epoch。同 seq 同载荷重放，冲突 409、陈旧 accepted=false；
        每 session 最高 2Hz（正常 playing 每 1s）。回复 playbackStarted=true 表示服务器在当前身份/策略、generation、
        ready/playing/paused 及受控交付事实均有效时接受了 playing 观测并原子设置独立 playback_started_at：仅解除
        readyAt+60s 未起播期限，不设置 sessionStarted、不写 ledger/history、不授予完成/carry 资格；收到 HTTP 确认后
        UI 才视为解除等待。限流 phase 观测独立 120/min/session；写 body<=16KiB。
