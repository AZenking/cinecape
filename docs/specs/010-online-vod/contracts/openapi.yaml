  /playback/sessions/{sessionId}/finish:
    post:
      operationId: vod_finishPlayback
      summary: vodFinishPlayback
      description: >-
        200 FinishReceipt；同 payload 重放（replayed=true），不在终态升级；硬非法 400/409 整次回滚。无证据不等于接口
        失败（可 ended=true/autoNextEligible=false）。finish/progress/stop 共用 payload 摘要与 seq 领域机但不同
        operation 身份；收到 finish 后停周期链并等待已分配样本完成，不让 final 先越过未决 started。final 使用本次样本，
        最后 10 秒周期缺失不单独拒绝。same operationKey 异 payload 409；operationKey 必须为 UUID；session 只有一份不可
        变 finish 结果；已有 receipt 且新 key 不同则 409 FINISH_ALREADY_RECORDED（附恢复路径而不重算）；旧 stop 先赢时
        首次 finish 只登记 stopped_elsewhere receipt 而不写新 final。finish 重放先校验身份/归属再读 receipt，不要求
        活动态。写 body<=16KiB。
      x-access: playback
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishReceipt'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/FinishConflict409'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishRequest'
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
