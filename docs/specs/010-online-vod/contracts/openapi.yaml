      description: >-
        200 FinishReceipt|null；只当前原设备/原上下文可读，用于丢响应恢复；跨上下文/跨设备/不存在 404 同形，禁止跨
        上下文读旧结果。不要求活动态（finish 重放先校验身份/归属再读 receipt）。
