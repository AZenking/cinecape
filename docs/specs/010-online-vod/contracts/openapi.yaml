openapi: 3.1.0
info:
  title: Online VOD Playback & Transitions
  version: 0.1.0-proposed
  description: >-
    010 target contract only; Accepted 2026-10-30 (contracts/api.md frozen, T002). Same OpenAPI 3.1.0
    style/security/naming as 005-pc-browsing-flow; 010 is an extension of that contract. Paths, DTO fields
    and error semantics not declared here are inherited from 004/005 strictly unchanged (GET session state /
    renew / seek / selection / heartbeat / stream assets keep their 004/005 inputs; their PlaybackDto gains
    the 010 extension fields declared in this file and mirrored as optional fields in 005). api.md §0–§7
    remain the authority for authorization order, transaction ordering and failure semantics; this file adds
    no field that api.md does not define.
servers:
  - url: /api
security:
  - SessionCookie: []
  - SessionBearer: []
paths:
  /settings/sources:
    get:
      operationId: vod_settings_listSources
      summary: listSources (010 view)
      description: >-
        010 extends the 005 source DTO with kind=vod and capabilities. Settings guard required; only
        Settings can read sources. Pagination identical to 005 (page/pageSize).
      x-access: settings
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/SettingsForbidden403'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
    post:
      operationId: vod_settings_createVodSource
      summary: createVodSource
      description: >-
        Settings；201。013(ADR-0017/FR-005)起常规管理操作免当次主账号密码。010 仅新增 kind=vod 分支：name +
        remoteUrl(http(s) 根地址并校验) + adapter=apple-cms-json；iptv/epg/nas 仍按 005 定义。限 10 启用源，超额
        409 VOD_QUOTA_EXCEEDED；授权错误不包装为业务结果。Settings 沿用 005 独立请求体上限（非 16KiB 通用写上限）。
      x-access: settings
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/SettingsForbidden403'
        '409':
          $ref: '#/components/responses/VodQuotaExceeded409'
        '423':
          $ref: '#/components/responses/Locked423'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VodCreateSourceRequest'
  /settings/sources/{sourceId}:
    patch:
      operationId: vod_settings_patchSource
      summary: patchSource (010 rules)
      description: >-
        Settings + CAS(expectedVersion)。013(ADR-0017/FR-005)起常规管理操作免当次主账号密码。010 约束：根地址字段
        （remoteUrl 等）拒绝 400；改名不失效活动 locator，启停均使 locator 失效（locator_revision+1 防 ABA）。
        跨家庭/不存在 404 同形。
      x-access: settings
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/SettingsForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/StateConflict409'
        '423':
          $ref: '#/components/responses/Locked423'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VodPatchSourceRequest'
      parameters:
        - $ref: '#/components/parameters/SourceIdPath'
  /settings/sources/{sourceId}/test:
    post:
      operationId: vod_settings_testSource
      summary: testSource
      description: >-
        Settings；013(ADR-0017/FR-005)起免当次主账号密码，请求体为空对象。对配置源做可达/兼容/能力探测；不写媒体、不建目录。
        有界请求，超时/无效/不可用以 reason 表达。
      x-access: settings
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTestResult'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/SettingsForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '423':
          $ref: '#/components/responses/Locked423'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTestRequest'
      parameters:
        - $ref: '#/components/parameters/SourceIdPath'
  /public/vod/search:
    get:
      operationId: vod_publicSearch
      summary: vodPublicSearch
      description: >-
        Public、无 cookie 过滤、不设身份 cookie。首次 {q:1–100} 或后续 {searchId, cursor?}，两组互斥（同给 400）；
        缺 cursor 重放第一页。每页 20，正常 next 页 partial=false；全源失败 502，全部超时 504。固定来源轮转缓冲、按
        (source,VOD ID) 去重、同 cursor 并发合并；已生成页重放不变；10min/最多 2000 结果；ref 失效 410
        VOD_SEARCH_EXPIRED（保留 q 重新搜索）。限流：在线搜索 20/min/IP（公共查询总桶 120/min/IP 之内）。搜索不物化、
        不建个人记录。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '410':
          $ref: '#/components/responses/VodSearchExpired410'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '502':
          $ref: '#/components/responses/UpstreamFailed502'
        '504':
          $ref: '#/components/responses/GatewayTimeout504'
      parameters:
        - name: q
          in: query
          required: false
          description: 首次搜索关键词；与 searchId 互斥。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: searchId
          in: query
          required: false
          description: 后续翻页搜索 ID；与 q 互斥。
          schema:
            type: string
            minLength: 1
        - name: cursor
          in: query
          required: false
          description: 上一响应 nextCursor 原样回传；仅与 searchId 同用。
          schema:
            type: string
            minLength: 1
  /public/vod/titles/{titleRef}:
    get:
      operationId: vod_publicTitlePreview
      summary: vodPublicTitlePreview
      description: >-
        Public。200 VodPreview；ref 失效 410 VOD_PREVIEW_EXPIRED；跨家庭/伪造 404 同形。预算：最多 20 线路/单线
        2000 集/合计 5000 集/4MiB，超体积与超条目一律 422 整次失败（VOD_DETAIL_TOO_LARGE）。预览不物化、不建个人记录；
        每家庭 1000 个活预览，超额拒绝或淘汰最早过期项。禁源/配置失配先失效缓存再拒绝旧页。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodPreview'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NotFound404'
        '410':
          $ref: '#/components/responses/VodPreviewExpired410'
        '422':
          $ref: '#/components/responses/VodDetailTooLarge422'
        '429':
          $ref: '#/components/responses/RateLimited429'
      parameters:
        - $ref: '#/components/parameters/TitleRefPath'
  /public/vod/posters/{posterRef}:
    get:
      operationId: vod_publicPosterProxy
      summary: vodPublicPosterProxy
      description: >-
        Public 同源海报代理。posterRef 为 p 级不透明引用（搜索/预览卡片 posterRef 字段原样回传；
        不可解码，不携带上游地址）。服务端经 SafeUpstream 有界读取注册的私有海报地址（≤2MiB、8s/4s/3 跳，
        与来源许可列表同一口径），仅接受上游 image/* 未编码响应并原样回传字节。伪造/未签发/跨家庭 404 同形；
        过期未淘汰 410 VOD_PREVIEW_EXPIRED；上游失败或非图片响应 502 UpstreamFailed502；超预算 504
        GatewayTimeout504。纯读不落盘；公共读取不根据 cookie 过滤内容。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NotFound404'
        '410':
          $ref: '#/components/responses/VodPreviewExpired410'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '502':
          $ref: '#/components/responses/UpstreamFailed502'
        '504':
          $ref: '#/components/responses/GatewayTimeout504'
      parameters:
        - name: posterRef
          in: path
          required: true
          description: p 级不透明海报引用（搜索/预览响应 posterRef 字段原样回传）
          schema:
            type: string
            minLength: 1
  /public/media:
    get:
      operationId: vod_publicMediaList
      summary: publicMediaList (010 view)
      description: >-
        原 005 参数与响应分页；010 行为扩展：vod 条目只展示已物化且可用父项（detailKind=vod_title），不重复铺子项；
        NAS/IPTV 行为保留。公共读取不根据 cookie 过滤内容。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMediaPage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - channel
              - movie
              - series
              - episode
              - video
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
  /public/media/{mediaId}:
    get:
      operationId: vod_publicMediaDetail
      summary: publicMediaDetail (010 view)
      description: >-
        005 公共媒体详情；010 扩展 PublicMedia 追加 detailKind:standalone|vod_title|vod_episode 与
        parentMediaId:null|string。无个人信息、无播放 URL。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMedia'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
  /public/media/{mediaId}/episodes:
    get:
      operationId: vod_publicMediaEpisodes
      summary: vodPublicMediaEpisodes
      description: >-
        Public。200 StableEpisodes，每页总计 100 子项；修订绑定 cursor，详情变化 409 VOD_DETAIL_CHANGED（重读并明确
        重选，不复用旧位置）；非父媒体 400；不可用/不存在/跨家庭 404 同形。线路可跨页重复，消费者按 lineRef 聚合。
      x-access: public
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StableEpisodes'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/VodDetailChanged409'
        '429':
          $ref: '#/components/responses/RateLimited429'
      parameters:
        - $ref: '#/components/parameters/MediaIdPath'
        - name: cursor
          in: query
          required: false
          description: 不透明游标，绑定详情修订。
          schema:
            type: string
            minLength: 1
  /vod/materializations:
    post:
      operationId: vod_materialize
      summary: vodMaterialize
      description: >-
        Profile 鉴权。请求严格 oneOf：titleRef+episodeRef 分支 或 candidateRef 分支。物化来源/预览/策略事实与新增净
        配额在同一短事务检查，资源和幂等结果同提交。先查成功重放（同成功 key 200 replayed=true），再要求预览有效；首次
        key 201；稳定 key 已存在可复用 ID。同 key 异摘要 409 IDEMPOTENCY_CONFLICT；新操作预览变化 409
        VOD_DETAIL_CHANGED；过期 410 VOD_PREVIEW_EXPIRED；满额 409 VOD_QUOTA_EXCEEDED；旧结果目标内容/连续性变化 409
        VOD_MATERIALIZATION_STALE；候选绑定冲突 404。幂等 scope=家庭/DeviceSession/contextVersion，目标 24h 受回收
        保护；当前权限失效拒绝而非仍返成功。写 body<=16KiB。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Same operationKey successful replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materialized'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '201':
          description: First successful materialization for this operationKey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materialized'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/VodMaterializationConflict409'
        '410':
          $ref: '#/components/responses/VodPreviewExpired410'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterializationRequest'
  /me/vod/preferences:
    get:
      operationId: vod_getPreferences
      summary: vodGetPreferences
      description: >-
        Profile 鉴权；200 Preferences。未有持久行返回默认 true/true/version=0（传输初值），不偷偷写公共状态。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
    patch:
      operationId: vod_patchPreferences
      summary: vodPatchPreferences
      description: >-
        Profile 鉴权。{expectedVersion>=0, autoplayNext?, switchCarryPosition?, operationKey:UUID}，至少一个偏好
        字段。CAS 不符 409；成功 key 24h 重放返回原响应、不再更新版本（先重验当前身份）；异 digest 409
        IDEMPOTENCY_CONFLICT。写 body<=16KiB。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '409':
          $ref: '#/components/responses/VodPreferencesConflict409'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VodPreferencesPatchRequest'
  /me/vod/titles/{parentId}/progress:
    get:
      operationId: vod_titleProgress
      summary: vodTitleProgress
      description: >-
        Profile 鉴权；200 TitleProgress。不存在父 404；自己的不可用历史仍能作为 latest 摘要，不泄露其他 Profile。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleProgress'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/RateLimited429'
      parameters:
        - $ref: '#/components/parameters/ParentIdPath'
  /me/history:
    get:
      operationId: vod_historyList
      summary: historyList (010 view)
      description: >-
        继承 005 分页与授权；010 在 HistoryItem 上为在线媒体追加 resumeCheckRequired=true（canResume 映射为候选资格），
        静态媒体原语义不变、不返回该字段。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '429':
          $ref: '#/components/responses/RateLimited429'
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
  /me/history/{mediaId}:
    get:
      operationId: vod_historyProgress
      summary: historyProgress (010 view)
      description: >-
        继承 005：HistoryItem 或 200 null（没有个人记录）；已不可用也只返回该 Profile 自己的摘要。010 的候选续播
        语义经 HistoryItem.resumeCheckRequired 表达。
      x-access: profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success (HistoryItem or null)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HistoryItem'
                  - type: 'null'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
