        body={}。200 {outcome, successorSessionId, slotRevision}。取消与消费 CAS 竞争：取消赢则 intent 取消不能消费；
        消费赢则返回 successorSessionId（仅原上下文可见），协调器显式 stop 不需要的后继。取消已经输给消费返回 successor；
        找回后继失败/ended 仍返回终态，不能再次消费造新播放。
