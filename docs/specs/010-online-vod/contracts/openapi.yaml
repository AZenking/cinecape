        保留 005 body 及行为，仍 204 无 body。无 auto-next 资格；先赢的 stop 使后到 finish 返回 not_completed 且不补
        写 final；已终态的重复 stop 保持 204。无权读取 receipt 时只允许既有最小空 stop 清理。
