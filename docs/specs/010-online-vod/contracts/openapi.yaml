  /playback/resolve:
    post:
      operationId: vod_playbackResolve
      summary: vodPlaybackResolve
      description: >-
        请求严格 oneOf：基础 {mediaId, startMode?:beginning|resume（默认 beginning）} 或 过渡
        {mediaId, transitionIntentId}；过渡分支禁止 startMode 字段。201 仍仅表示接受（无票）+Location；相同已消费
        intent 重放 200 同后继当前状态，不重建。父项 400 VOD_EPISODE_REQUIRED 在身份/策略检查后判定，不尝试找父播放
        资源。intent.positionMode 映射唯一 startBasis：carry 来自冻结 ledger，target_history 在 probe 后读当前
        Profile 目标历史并冻结一次，beginning=0；禁止第二次 resume 读取覆盖 carry；目标时长/匹配不兼容回退 beginning
        并有 reason。发票仍走 renew。resolve 沿用 004 控制桶限流；写 body<=16KiB。
      x-access: playback
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Consumed transition intent replay; same successor current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackDto'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '201':
          description: Accepted; no ticket in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackDto'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
            Location:
              $ref: '#/components/headers/LocationPlaybackSession'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/ResolveConflict409'
        '410':
          description: >-
            410 TRANSITION_EXPIRED（intent 未消费过期，用户重新发起、不自动携带过期 carry）或 NEXT_PLAN_EXPIRED
            （绑定计划过期）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VodResolveRequest'
  /playback/sessions/{sessionId}/progress:
