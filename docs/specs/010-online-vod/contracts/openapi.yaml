  /playback/transition-intents:
    post:
      operationId: vod_createTransitionIntent
      summary: vodCreateTransitionIntent
      description: >-
        IntentRequest 严格 oneOf（next/manual_next 或 switch/recover_switch）。201 IntentReply；新 key 复用已有
        pending 同选择可 200；不同选择必须以同 POST 新 operationKey+expectedSlotRevision 显式 replace（旧 intent 标
        superseded）。冲突 409 TRANSITION_SLOT_CONFLICT；创建均验证计划/候选与当前序列、详情、历史 revision 及偏好：
        任一变化 409 NEXT_PLAN_CHANGED（重新展示并确认，不静默消费）；计划过期 410 NEXT_PLAN_EXPIRED。carry 须提供
        sourceCheckpoint，且事务读取的当前代 ledger 必须精确等于该游标，否则 409 SOURCE_PROGRESS_PENDING；选择更早
        位置须 allowEarlierAcceptedPosition=true + 该游标 + 新 operationKey。创建/消费均不发票。限流 10/min/
        DeviceSession；写 body<=16KiB。slot 消费后任何新 key 也 409 并附原后继引用（仅原上下文可见）；同 key 重放不续
        TTL。
      x-access: playback
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Same operationKey replay / reuse of existing pending intent with identical choice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentReply'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '201':
          description: Intent created (pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentReply'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicyNoReferrer'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/ProfileForbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/TransitionIntentConflict409'
        '410':
          $ref: '#/components/responses/NextPlanExpired410'
        '429':
          $ref: '#/components/responses/RateLimited429'
        '503':
          $ref: '#/components/responses/StorageNotReady503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
  /playback/transition-intents/{intentId}:
    get:
      operationId: vod_getTransitionIntent
      summary: vodGetTransitionIntent
      description: >-
        当前上下文归属（A→B→A 的 contextVersion 不等即 404）。200 IntentReply（consumed 含 successorSessionId）；过期
        未消费 410（不误作可重新消费）。完整 IntentReply 要求当前源/目标权限；失权时不返回完整结果——使用
