  /playback/stream/{sessionId}/{generation}/{assetId}:
    parameters:
      - $ref: '#/components/parameters/B004SessionIdPath'
      - $ref: '#/components/parameters/B004GenerationPath'
      - $ref: '#/components/parameters/B004AssetIdPath'
      - $ref: '#/components/parameters/B004TicketQuery'
    get:
      tags:
        - playback-media
      operationId: playback_getStreamAsset
      summary: 播放网关媒体资产(HLS 清单/分片/初始化片/key/字幕/direct 字节流)
      description: >-
        服务端统一播放入口的媒体资产交付(FR-001/FR-006):入口清单、分片、初始化片、key、字幕 均以资产 ID(assetId)寻址,不接受 URL 或路径参数,不向客户端暴露源地址。
        逐请求授权链:SessionGuard(最新有效设备会话) → ticket hash 及 TTL → 绑定 session/device/profile → 最新策略与源事实 →
        generation/asset 归属 → 交付; 任一环节失效即拒绝且不再交付新响应(FR-011);ticket 不能用于其他 session/generation (旧 generation 无论
        TTL 都不可用),asset 枚举不存在统一 404 同形。 安全方案:设备会话(Cookie 或 Bearer)+ query ticket 双重授权,ticket 不能单独授权。 HLS:清单
        MIME application/vnd.apple.mpegurl,内部相对 URI 重写后只指向本入口, 原清单禁止原样返回;key 为 application/octet-stream;字幕为
        text/vtt 且只含文字, 播放器不得以 HTML 执行(FR-017);拒绝 DRM 及未知 URI 标签;上游重定向不返回给浏览器; 上游不收到应用 Cookie/Bearer,禁止透传其
        Set-Cookie(research R3)。 NAS direct:支持 GET/HEAD/单 Range —— 200/206、Accept-Ranges: bytes、
        Content-Length/Content-Range 一致;越界 416,多个 Range 400;HEAD 与 GET 同鉴权。 源故障:未发送 headers 时返回 problem(503
        PLAYBACK_RESOURCE_UNAVAILABLE); 已发送字节则关闭流并将失败码写入会话,客户端轮询 GET /playback/sessions/{sessionId}
        获取友好原因,不得在字节流内注入 JSON(FR-010/FR-013)。 客户端断开必须取消上游读取(FR-019);不承诺撤回已缓存内容或已开始发送的响应(FR-011)。 所有响应
        Cache-Control: no-store、Referrer-Policy: no-referrer,媒体字节不公开缓存。
      x-fr-mapping:
        - FR-001
        - FR-006
        - FR-008
        - FR-010
        - FR-011
        - FR-017
        - FR-019
      x-request-budget:
        rateLimit: >-
          不适用控制端限频(resolve/seek/selection 30 次分/设备、renew 10 次分/设备不覆盖媒体分片, 播放器频繁 Range
          请求不重复计会话);受部署级并发/backpressure 预算约束。
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: >-
            资产内容:HLS 入口清单(application/vnd.apple.mpegurl,重写后仅指向本入口)、
            媒体分片/初始化片/key/原始字节(application/octet-stream)、 WebVTT 字幕(text/vtt)、direct 渐进字节流(如 video/mp4)。
            direct 字节流附 Accept-Ranges: bytes 与一致的 Content-Length;HEAD 同元数据但不发送字节。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              $ref: '#/components/headers/B004ReferrerPolicyNoReferrer'
            Accept-Ranges:
              $ref: '#/components/headers/B004AcceptRangesBytes'
            Content-Length:
              $ref: '#/components/headers/B004ContentLengthHeader'
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
              examples:
                manifest:
                  summary: 重写后的 HLS 入口清单(相对 URI 仅指向本入口)
                  value: |
                    #EXTM3U
                    #EXT-X-TARGETDURATION:6
                    #EXTINF:6.000,
                    seg-0001
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/vtt:
              schema:
                type: string
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: 单区间 Range 部分内容(NAS direct);Content-Range 与请求一致;不允许多区间。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              $ref: '#/components/headers/B004ReferrerPolicyNoReferrer'
            Content-Range:
              $ref: '#/components/headers/B004ContentRangeHeader'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: 多个 Range 区间或畸形 Range 头(VALIDATION_FAILED)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          description: >-
            SESSION_INVALID(无会话/失效/撤销)或 PLAYBACK_TICKET_INVALID / PLAYBACK_TICKET_EXPIRED (ticket 缺失/不属于该
            session+generation/已过期;复制到其他设备/会话因绑定失效)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          description: ACTIVE_PROFILE_REQUIRED 或既有 PIN/家长验证错误;档案切换/策略收紧后下一次播放请求拒绝, 不返回策略明细。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          description: 同形 404:PLAYBACK_NOT_FOUND(会话/代次/资产枚举不匹配或不存在)与 MEDIA_NOT_FOUND(媒体不可见/跨家庭),不泄漏存在性与原因差异。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '416':
          description: Range 越界(超出字节长度)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          description: >-
            PLAYBACK_RESOURCE_UNAVAILABLE —— 媒体请求开始后源故障且尚未发送 headers 时返回 problem; 已发送字节则直接关闭流(失败码写入会话,由 GET
            会话轮询获得),不在字节流内注入 JSON。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      x-access: playback
    head:
      tags:
        - playback-media
      operationId: playback_headStreamAsset
      summary: 播放网关媒体资产元数据(与 GET 同鉴权,不发送字节)
      description: >-
        与 GET 完全相同的逐请求授权链(SessionGuard → ticket hash/TTL → 绑定 → 最新策略与源事实 → generation/asset
        归属,FR-006/FR-011)与相同响应头(含 direct 的 Accept-Ranges/Content-Length、 206 的 Content-Range),但不发送任何字节。HEAD 与
        GET 同鉴权; 其余错误语义与 GET 相同(401/403/404/416/503 同形)。
      x-fr-mapping:
        - FR-001
        - FR-006
        - FR-008
        - FR-011
        - FR-017
        - FR-019
      x-request-budget:
        rateLimit: 不适用控制端限频;受部署级并发/backpressure 预算约束(与 GET 相同)。
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: >-
            资产元数据:与 GET 相同的头(含 Cache-Control: no-store、Referrer-Policy: no-referrer、 direct 字节流的
            Accept-Ranges: bytes 与 Content-Length);无响应体。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              $ref: '#/components/headers/B004ReferrerPolicyNoReferrer'
            Accept-Ranges:
              $ref: '#/components/headers/B004AcceptRangesBytes'
            Content-Length:
              $ref: '#/components/headers/B004ContentLengthHeader'
        '206':
          description: 单区间 Range 的元数据响应(Content-Range 与请求一致);不发送字节。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              $ref: '#/components/headers/B004ReferrerPolicyNoReferrer'
            Content-Range:
              $ref: '#/components/headers/B004ContentRangeHeader'
        '400':
          description: 多个 Range 区间或畸形 Range 头(VALIDATION_FAILED)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          description: SESSION_INVALID 或 PLAYBACK_TICKET_INVALID / PLAYBACK_TICKET_EXPIRED(与 GET 相同)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '403':
          description: ACTIVE_PROFILE_REQUIRED 或既有 PIN/家长验证错误(与 GET 相同)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          description: 同形 404:PLAYBACK_NOT_FOUND / MEDIA_NOT_FOUND(会话/代次/资产/可见性),不泄漏差异。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '416':
          description: Range 越界(超出字节长度)。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '503':
          description: PLAYBACK_RESOURCE_UNAVAILABLE —— 源故障且未发送 headers 时返回 problem。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/B004Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      x-access: playback
  /playback/sessions/{sessionId}/progress:
    post:
      operationId: saveProgress
      summary: saveProgress
      description: >-
        Current session/profile/generation/resource and duration validation. First actual-playing started
        claims writer epoch; client waits for its ACK before subsequent samples. Bind profileContextVersion to
        prevent A-B-A revival. Older epoch/sequence does not overwrite; equal latest seq/different payload
        409. Every10s and pause, separate from 15s heartbeat.
      x-access: playback
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResult'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '400':
          description: Invalid input/cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '401':
          description: Session invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '403':
          description: Profile/settings access or password verification required/failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '404':
          description: Target absent or outside household
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '409':
          description: Version/state/progress conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '422':
          description: Guide window too large or unsupported media
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '423':
          description: PIN/password locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '429':
          description: Rate limited; Retry-After
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '503':
          description: Storage generation or dependency not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressSample'
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
components:
  schemas:
    B001Problem:
      type: object
      description: RFC 9457 problem details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: 机器可读错误码
          如 INITIALIZATION_ALREADY_DONE: null
      additionalProperties: false
    B001HouseholdDto:
      type: object
      required:
        - id
        - name
        - defaultLanguage
        - timezone
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultLanguage:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    B001ProfileDto:
      type: object
      description: 不包含 pinHash 等凭据字段
      required:
        - id
        - name
        - type
        - isDefault
        - status
        - createdAt
        - isMain
        - version
        - pinProtected
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - adult
            - child
        isDefault:
          type: boolean
        pinProtected:
          type: boolean
          description: 是否设置了 PIN(不暴露哈希)
        status:
          type: string
          enum:
            - active
            - disabled
        createdAt:
          type: string
          format: date-time
        isMain:
          type: boolean
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      additionalProperties: false
    B001DeviceDto:
      type: object
      required:
        - id
        - type
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
        type:
          type: string
          enum:
            - web
            - mobile
            - tv
            - nas
            - other
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    B001SessionDto:
      description: 当前会话上下文;sessionToken 仅在登录响应出现一次
      required:
        - sessionId
        - expiresAt
        - householdId
        - bootstrapRequired
        - profileContextVersion
        - account
        - activeProfile
      properties:
        sessionId:
          type: string
          format: uuid
        account:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
            role:
              type: string
              enum:
                - owner
                - admin
          additionalProperties: false
        activeProfile:
          oneOf:
            - $ref: '#/components/schemas/B001ProfileDto'
            - type: 'null'
        sessionToken:
          type: string
          description: 仅 POST /auth/login 响应包含;凭此走 Bearer 通道
        expiresAt:
          type: string
          format: date-time
        householdId:
          type: string
          format: uuid
        bootstrapRequired:
          type: boolean
        profileContextVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      type: object
      additionalProperties: false
    B001InitializeRequest:
      type: object
      required:
        - householdName
        - username
        - password
      properties:
        householdName:
          type: string
          minLength: 1
          maxLength: 100
        defaultLanguage:
          type: string
          default: zh-CN
        timezone:
          type: string
          default: Asia/Shanghai
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      additionalProperties: false
    B001LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        deviceType:
          type: string
          enum:
            - web
            - mobile
            - tv
            - nas
            - other
          default: web
        deviceName:
          type: string
          maxLength: 100
      additionalProperties: false
    B001CreateProfileRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        type:
          type: string
          enum:
            - adult
            - child
        avatar:
          type: string
        isDefault:
          type: boolean
          default: false
        pin:
          type: string
          pattern: ^[0-9]{6}$
      additionalProperties: false
    B001UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        avatar:
          type: string
        isDefault:
          type: boolean
        status:
          type: string
          enum:
            - active
            - disabled
        pin:
          type: string
          pattern: ^[0-9]{6}$
        clearPin:
          type: boolean
          default: false
        ownerPassword:
          type: string
          format: password
          description: 可选；013(ADR-0017/FR-005)条件语义：仅当本次请求含 pin 或 clearPin（设置/修改/清除档案 PIN）时服务端要求当次主账号密码，缺失或错误 → 403 PARENT_VERIFICATION_*；仅名称/头像/默认标记/停用编辑不要求密码。不回显、不落日志。
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      additionalProperties: false
      required:
        - expectedVersion
    B001SelectProfileRequest:
      type: object
      description: 阶段 2(002 契约):家庭存在儿童档案时,选择未设 PIN 成人必填 ownerPassword;设 PIN 目标沿用解锁授予,不以此替代
      properties:
        ownerPassword:
          type: string
          format: password
      additionalProperties: false
    B001UnlockRequest:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          format: password
      additionalProperties: false
    B002Problem:
      type: object
      description: RFC 9457 problem details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: 机器可读错误码
          如 POLICY_VERSION_CONFLICT: null
      additionalProperties: false
    B002PolicyDto:
      type: object
      description: 单档案内容策略;名单为去重排序后的不透明媒体标识(本阶段只读,默认空)
      required:
        - profileId
        - maxContentLevel
        - allowUnrated
        - allowedMediaIds
        - blockedMediaIds
        - allowedChannelIds
        - version
        - updatedAt
      properties:
        profileId:
          type: string
          format: uuid
        maxContentLevel:
          type: integer
          minimum: 0
          maximum: 18
          description: 内部年龄阈值 0～18(成人默认 18、儿童默认 12),非法定/地区分级
        allowUnrated:
          type: boolean
          description: 未评级媒体是否允许(成人默认 true、儿童默认 false)
        allowedMediaIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 1000
        blockedMediaIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 1000
        allowedChannelIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 1000
        version:
          type: integer
          minimum: 1
          description: 乐观并发版本
          每次成功保存 +1: null
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    B002PolicyEditable:
      type: object
      description: 阶段 2 可编辑配置;三名单由服务端原样保留,不接受请求覆盖(FR-009/FR-013)
      required:
        - maxContentLevel
        - allowUnrated
      properties:
        maxContentLevel:
          type: integer
          minimum: 0
          maximum: 18
        allowUnrated:
          type: boolean
      additionalProperties: false
    B002UpdatePolicyRequest:
      type: object
      description: 严格对象:未知字段拒绝(400 VALIDATION_FAILED)。013(ADR-0017/FR-005)起常规管理操作免当次主账号密码
      required:
        - expectedVersion
        - policy
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        policy:
          $ref: '#/components/schemas/B002PolicyEditable'
      additionalProperties: false
    B003Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
      required:
        - type
        - title
        - status
        - code
    B003Source:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - iptv
            - epg
            - nas
            - vod
        name:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
          minimum: 1
        epgSourceId:
          type:
            - string
            - 'null'
          format: uuid
        locationLabel:
          type: string
          description: 脱敏主机标签或 rootKey；不含地址路径/query/userinfo
        lastSuccessAt:
          type:
            - string
            - 'null'
          format: date-time
        lastJobId:
          type:
            - string
            - 'null'
          format: uuid
        capabilities:
          type: object
          additionalProperties: false
          description: >-
            010 扩展（2026-10-30）：仅 kind=vod 时返回；resume=operational 为候选语义，最终续播资格需当次
            resolve/probe 判定。
          required:
            - resume
            - requiresCurrentProbe
          properties:
            resume:
              type: string
              enum:
                - operational
            requiresCurrentProbe:
              type: boolean
              const: true
      required:
        - id
        - kind
        - name
        - enabled
        - version
        - epgSourceId
        - locationLabel
        - lastSuccessAt
        - lastJobId
    B003CreateSource:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - iptv
            - epg
            - nas
            - vod
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
          default: true
        remoteUrl:
          type: string
          format: uri
          writeOnly: true
        rootKey:
          type: string
          minLength: 1
          writeOnly: true
        relativeDirectory:
          type: string
          writeOnly: true
        privateAccessApproved:
          type: boolean
          default: false
        epgSourceId:
          type:
            - string
            - 'null'
          format: uuid
        adapter:
          type: string
          enum:
            - apple-cms-json
          description: >-
            010 扩展（2026-10-30）：kind=vod 时必填且恒为 apple-cms-json；remoteUrl 仅接受 http(s) 根地址；严格分支
            校验以 docs/specs/010-online-vod/contracts/openapi.yaml 为权威。
      required:
        - kind
        - name
      description: >-
        013(ADR-0017/FR-005)起免当次主账号密码。远程必须 remoteUrl，NAS 必须 rootKey/relativeDirectory 且无 remoteUrl；epgSourceId 仅
        IPTV。跨字段校验见 api.md。
      allOf:
        - if:
            properties:
              kind:
                const: nas
            required:
              - kind
            type: object
            additionalProperties: false
          then:
            required:
              - rootKey
              - relativeDirectory
