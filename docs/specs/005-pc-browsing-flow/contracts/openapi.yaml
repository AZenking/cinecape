        preparing→ready/failed/ended/interrupted;ready→playing/paused;playing↔paused;
        ready/playing/paused→preparing(seek 或需重建输出的换轨); 任一活动态→ended/failed/interrupted,终态不可复活。 preparing 拒绝
        renew/第二次 seek/selection(409 PLAYBACK_NOT_READY); 准备完成进 ready,首次媒体交付进 playing 并设置 started_at(之后不重置);
        暂停期间必须继续 heartbeat。
