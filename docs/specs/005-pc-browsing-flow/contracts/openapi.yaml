  /public/live/channels/now-playing:
    get:
      operationId: liveChannelsNowPlaying
      summary: liveChannelsNowPlaying
      description: >-
        Batch current/next programme projection for live channels (016 api.md §1.1);
        guest-public, no session required. mediaIds optional (comma-separated media IDs;
        default all available live channels of the household), now optional baseline
        instant. Programme keys are opaque; no upstream identifiers.
      x-access: public
      security: []
      parameters:
        - name: mediaIds
          in: query
          required: false
          description: Comma-separated media IDs to project; default all available live channels.
          schema:
            type: string
        - name: now
          in: query
          required: false
          description: Baseline UTC instant for walkthrough/testing; default server current time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NowPlayingPage'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
        '400':
