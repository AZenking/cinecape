  /playback/sessions/{sessionId}:
    get:
      tags:
        - playback-control
      operationId: playback_getPlaybackSession
      summary: 查询播放会话状态(轮询准备状态/失败原因)
      description: >-
        仅原有效设备会话+原当前档案可查询;跨设备/跨家庭统一 404 PLAYBACK_NOT_FOUND 同形。 用于轮询 preparing→ready
        的准备状态(FR-005)与失败友好原因(state=failed 时 failureCode 给出公开稳定码,如
        PLAYBACK_FORMAT_UNSUPPORTED/PLAYBACK_PERFORMANCE_INSUFFICIENT/
        PLAYBACK_RESOURCE_UNAVAILABLE/PLAYBACK_PREPARE_TIMEOUT,不含源诊断,FR-010/FR-013/FR-015)。 GET
        不重签也不复现旧票:playbackUrl 与 ticketExpiresAt 恒为 null, ready 后须以该 generation 调用 renew 取票。stop 后仍允许原有效设备查询终态,
        但不能以终态签票。
      x-fr-mapping:
        - FR-005
        - FR-007
        - FR-010
        - FR-013
        - FR-015
      x-request-budget:
        bodyLimitBytes: 0
        rateLimit: 契约未定义限频(客户端轮询准备状态/失败原因)
      parameters:
        - $ref: '#/components/parameters/B004SessionIdPath'
      responses:
        '200':
          description: 当前会话状态;playbackUrl/ticketExpiresAt 恒为 null(GET 不重签不复现旧票); state=failed 时 failureCode 为公开稳定码。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              $ref: '#/components/headers/B004ReferrerPolicyNoReferrer'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B004PlaybackDto'
        '401':
          $ref: '#/components/responses/B004SessionInvalid'
        '404':
          $ref: '#/components/responses/B004PlaybackSessionNotFound'
      security:
        - SessionCookie: []
        - SessionBearer: []
      x-access: playback
  /playback/sessions/{sessionId}/renew:
    post:
      tags:
        - playback-control
      operationId: playback_renewPlaybackTicket
      summary: 换取/续期会话化播放凭据(ticket)
      description: >-
        仅 ready/playing/paused 可签发;preparing 返回 409 PLAYBACK_NOT_READY; 终态(ended/failed/interrupted)拒绝并 409
        PLAYBACK_ENDED(FR-005)。 每次续期重新执行完整授权链(最新设备会话/当前档案与绑定一致性/最新策略,FR-011), 授权不再放行时按稳定码拒绝(策略变化使媒体不可见时统一 404
        同形)。 复用既有任务/会话,仅换票;不改变 selection/version,不递增版本。 expectedGeneration(≥1 整数)在签发票的短事务内与当前 generation 比较,
        不一致返回 409 PLAYBACK_GENERATION_STALE 且不写票。 票默认 5 分钟 TTL(可配置):首次 ready 后立即申请,以后到期前 60 秒续期;
        续期签发新票行,旧票原过期时间不变。客户端须以本地 operationEpoch 匹配且 session/generation 一致才可安装响应,不能只按响应 generation 判断; 每次取得的
        URL 为携带 opaque ticket 的同源相对路径,不得写入 localStorage 或审计日志, 页面不向第三方发送 referrer。
      x-fr-mapping:
