        pageSize:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        totalChannels:
          type: integer
          minimum: 0
        catalogRevision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        channels:
          type: array
          items:
            $ref: '#/components/schemas/GuideChannel'
          maxItems: 50
      required:
        - date
        - timezone
        - now
        - allowedDates
        - from
        - to
        - page
        - pageSize
        - totalChannels
        - catalogRevision
        - channels
    BootstrapProfileRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        pin:
          type: string
          pattern: ^[0-9]{6}$
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - pin
        - ownerPassword
    PinRecoveryRequest:
      type: object
      additionalProperties: false
      properties:
        newPin:
          type: string
          pattern: ^[0-9]{6}$
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - newPin
        - ownerPassword
    SettingsUnlockRequest:
      type: object
      additionalProperties: false
      properties:
        pin:
          type: string
          pattern: ^[0-9]{6}$
      required:
        - pin
    SettingsAccess:
      type: object
      additionalProperties: false
      properties:
        unlocked:
          type: boolean
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - unlocked
        - expiresAt
    AccountSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
      required:
        - id
        - username
        - role
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      description: >-
        修改账号密码(013 FR-005:唯一保留当次密码验证的账号动作之一)。
        currentPassword 为准;ownerPassword 仅为 005 旧客户端过渡兼容字段,
        二者必须提供其一(服务端 refine 校验,全缺 400)。
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: 已废弃别名(currentPassword 的过渡兼容字段),优先使用 currentPassword。
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - newPassword
    HouseholdSettings:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        language:
          type: string
        timezone:
          type: string
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        mainProfileVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - name
        - language
        - timezone
        - version
        - mainProfileVersion
    PatchHouseholdRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 100
        language:
          type: string
          minLength: 1
          maxLength: 35
        timezone:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - expectedVersion
      description: 013(ADR-0017/FR-005)起家庭通用信息修改免当次主账号密码；expectedVersion CAS 不变
    MainProfileRequest:
      type: object
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Expected household.main_profile_version.
        expectedProfileVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Expected version of the target Profile.
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 128
        expectedCurrentProfileVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Expected version of the current main Profile, from the authenticated settings read.
      required:
        - profileId
        - expectedVersion
        - expectedProfileVersion
        - ownerPassword
        - expectedCurrentProfileVersion
    MainProfileReply:
      type: object
      additionalProperties: false
      properties:
        mainProfileId:
          type: string
          format: uuid
        mainProfileVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - mainProfileId
        - mainProfileVersion
    OwnerPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        ownerPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - ownerPassword
    FavoriteItem:
      type: object
      additionalProperties: false
      properties:
        media:
          $ref: '#/components/schemas/PublicMedia'
        createdAt:
          type: string
          format: date-time
        current:
          oneOf:
            - $ref: '#/components/schemas/Programme'
            - type: 'null'
        next:
          oneOf:
            - $ref: '#/components/schemas/Programme'
            - type: 'null'
      required:
        - media
        - createdAt
        - current
        - next
    HistoryItem:
      type: object
      additionalProperties: false
      properties:
        media:
          $ref: '#/components/schemas/PublicMedia'
        lastViewedAt:
          type: string
          format: date-time
        positionSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
        canResume:
          type: boolean
        resumeCheckRequired:
          type: boolean
          description: >-
            010 扩展（2026-10-30）：在线媒体 canResume 映射为候选资格时为 true，最终资格需当次 resolve/probe 判定；
            静态媒体原语义不变且不返回该字段。
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - media
        - lastViewedAt
        - positionSeconds
        - durationSeconds
        - canResume
        - revision
    FavoritePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'
        nextCursor:
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    HistoryPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        nextCursor:
          type:
            - string
            - 'null'
      required:
        - items
        - nextCursor
    ProgressSample:
      type: object
      additionalProperties: false
      properties:
        sampleSeq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expectedGeneration:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        positionSeconds:
          type: number
          minimum: 0
        reason:
          type: string
          enum:
            - started
            - periodic
            - pause
      required:
        - sampleSeq
        - expectedGeneration
        - positionSeconds
        - reason
    FinalProgress:
      type: object
      additionalProperties: false
      properties:
        sampleSeq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        expectedGeneration:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        positionSeconds:
          type: number
          minimum: 0
      required:
        - sampleSeq
        - expectedGeneration
        - positionSeconds
    ProgressResult:
      type: object
      additionalProperties: false
      properties:
        applied:
          type: boolean
        reason:
          type: string
          enum:
            - accepted
            - duplicate
            - stale_sample
            - superseded
        historyRevision:
          type:
            - integer
            - 'null'
          minimum: 1
        sessionAccepted:
          type: boolean
          description: 010 扩展（2026-10-30）：独立会话接受视图；superseded 可 sessionAccepted=true/applied=false。
        acceptedSampleSeq:
          type: integer
          minimum: 1
          description: 010 扩展（2026-10-30）：最后会话接受游标（stale_sample 时供恢复）。
        acceptedPositionSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: 010 扩展（2026-10-30）。
        acceptedGeneration:
          type: integer
          minimum: 1
          description: 010 扩展（2026-10-30）。
        sessionStarted:
          type: boolean
          description: 010 扩展（2026-10-30）。
      required:
        - applied
        - reason
        - historyRevision
    ResolveRequest:
      type: object
      additionalProperties: false
      properties:
        mediaId:
          type: string
          format: uuid
        startMode:
          type: string
          enum:
            - beginning
            - resume
          default: beginning
        transitionIntentId:
          type: string
          format: uuid
          description: >-
            010 扩展（2026-10-30）：过渡消费分支；出现时禁止 startMode（严格 oneOf，权威定义见
            docs/specs/010-online-vod/contracts/openapi.yaml POST /playback/resolve）。
      required:
        - mediaId
      allOf:
        - if:
            type: object
            required:
              - transitionIntentId
            properties:
              transitionIntentId:
                type: string
            additionalProperties: false
          then:
            not:
              required:
                - startMode
    StopRequest:
      type: object
      additionalProperties: false
      properties:
        finalProgress:
          $ref: '#/components/schemas/FinalProgress'
      required: []
    Empty:
      type: object
      additionalProperties: false
      properties: {}
      required: []
  responses:
    B001Problem401:
      description: 未认证/会话无效或已过期
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B001Problem'
    B001Problem403:
      description: 已认证但越权(资源不属于当前 Household/Account/会话)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B001Problem'
    B001Problem404:
      description: 资源不存在(不泄露跨家庭存在性)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B001Problem'
    B001Problem409:
      description: 状态冲突(重复初始化/最后可用 Profile 停用等)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B001Problem'
    B001Problem423:
      description: 锁定窗口内(PIN 或家长验证 Locked)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B001Problem'
    B001SessionAuth:
      description: 会话有效
      security:
        - sessionCookie: []
        - bearerSession: []
    B004ValidationFailed:
      description: 400 VALIDATION_FAILED —— JSON 语法错误/未知字段/非有限数值(NaN/Infinity)/ 超出范围或请求体超过 16KiB 限制。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
    B004SessionInvalid:
      description: 401 SESSION_INVALID —— 无会话/会话失效/设备撤销(含伪造或跨设备复用)。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
    B004ProfileForbidden:
      description: 403 ACTIVE_PROFILE_REQUIRED 或既有 PIN/家长验证错误(沿用 001/002 规则, 如记录查询密码缺失);不返回策略明细。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
    B004MediaNotFound:
      description: 404 MEDIA_NOT_FOUND —— 不存在/跨家庭/不可见(策略禁止)/无可用播放资源统一同形, 不泄漏存在性与原因差异(FR-003)。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
    B004PlaybackSessionNotFound:
      description: 404 PLAYBACK_NOT_FOUND —— 非本设备会话/跨设备/跨家庭统一同形 404。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
    B004RateLimited:
      description: >-
        429 PLAYBACK_RATE_LIMITED —— 超出该设备当前操作限频 (resolve/seek/selection 每设备每分钟 30 次共享桶;renew 每分钟 10 次; 详见各操作
        x-request-budget)。媒体分片不套此频率。
      headers:
        Retry-After:
          $ref: '#/components/headers/B004RetryAfterSeconds'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/B004Problem'
  parameters:
    B004SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: 播放会话 ID;跨设备/跨家庭访问统一 404 同形。
      schema:
        type: string
        format: uuid
    B004GenerationPath:
      name: generation
      in: path
      required: true
      description: 会话编辑代次(≥1);旧 generation 的 ticket 无论 TTL 都不可用。
      schema:
        type: integer
        minimum: 1
    B004AssetIdPath:
      name: assetId
      in: path
      required: true
      description: 服务端资产 ID(清单/分片/初始化片/key/字幕统称);不透明、服务端生成, 不接受 URL 或路径参数;asset 枚举不存在统一 404 同形。
      schema:
        type: string
        minLength: 1
    B004TicketQuery:
      name: ticket
      in: query
      required: true
      description: 播放 ticket(query 形态,按 api.md);与设备会话双重授权,不能单独授权; 不能用于其他 session/generation。
      schema:
        type: string
        minLength: 1
    B004DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: 目标设备 ID(当前家庭内);跨家庭统一 404 同形。
      schema:
        type: string
        format: uuid
  headers:
    B004CacheControlNoStore:
      description: 所有响应(含错误与媒体字节)禁止缓存/公开缓存。
      schema:
        type: string
        const: no-store
    B004ReferrerPolicyNoReferrer:
      description: 不向第三方发送 referrer;页面不向第三方发送 referrer。
      schema:
        type: string
        const: no-referrer
    B004RetryAfterSeconds:
      description: 限流(429 PLAYBACK_RATE_LIMITED)后建议等待的秒数。
      schema:
        type: integer
        minimum: 1
    B004AcceptRangesBytes:
      description: NAS direct 字节流支持单区间 Range。
      schema:
        type: string
        const: bytes
    B004ContentLengthHeader:
      description: 字节长度;HEAD 与 GET 一致(HEAD 不发送字节)。
      schema:
        type: integer
        minimum: 0
    B004ContentRangeHeader:
      description: 206 单区间内容范围;与请求 Range 一致。
      schema:
        type: string
    B004LocationPlaybackSession:
      description: 新建播放会话地址(同源相对路径,如 /api/playback/sessions/{sessionId})。
      schema:
        type: string
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
    SessionBearer:
      type: http
      scheme: bearer
    B001sessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
    B001bearerSession:
      type: http
      scheme: bearer
      description: 不透明会话令牌(仅签发时返回一次)
    B002sessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
    B002bearerSession:
      type: http
      scheme: bearer
      description: 不透明会话令牌(仅签发时返回一次)
    B003sessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
    B003bearerSession:
      type: http
      scheme: bearer
    B004sessionCookie:
      type: apiKey
      in: cookie
      name: hmp_session
      description: 浏览器同源 httpOnly 设备会话 Cookie(沿用 001);Native HLS 使用同源 Cookie; 每次播放请求校验最新有效会话,JSON 控制写操作须同源/CSRF 校验。
    B004bearerSession:
      type: http
      scheme: bearer
      description: 不透明设备会话令牌(仅签发时返回一次);Bearer 客户端逐请求携带原认证。
    B004playbackTicket:
      type: apiKey
      in: query
      name: ticket
      description: >-
        播放 ticket:随机 256bit 不透明令牌,仅在签发(renew)响应出现一次,服务端仅存 hash; 绑定播放会话+设备会话+generation,不能用于其他
        session/generation, 不能单独授权(媒体端点必须同时校验设备会话)。日志必须过滤 query ticket; 按 api.md 仅提供 query 形态(无 header
        形态),hls.js 加载器对子资源附加最新 ticket。
