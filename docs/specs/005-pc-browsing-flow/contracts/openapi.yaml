      type: object
      description: >-
        播放会话公共视图(api.md PlaybackDto;字段可空性以 data-model.md 为权威)。 playbackUrl/ticketExpiresAt 始终可空,且除
        renew(TicketReply)响应外恒为 null (GET 不重签也不复现旧票);delivery 在探测完成前为 null;tracks 探测未完成为空数组。
        任何字段不含源地址、文件路径、上游凭据、所选源ID、ffmpeg 命令或 stderr; playbackUrl 为携带 opaque ticket 的同源相对路径(无源地址),不得写入
        localStorage 或审计日志。
      additionalProperties: false
      required:
        - id
        - state
        - version
        - generation
        - desiredPaused
        - delivery
        - positionSeconds
        - durationSeconds
        - timelineOffsetSeconds
        - presentationStartSeconds
        - ticketExpiresAt
        - playbackUrl
        - tracks
      properties:
        id:
          type: string
          format: uuid
          description: 播放会话 ID。
        state:
          $ref: '#/components/schemas/B004PlaybackSessionState'
        version:
          type: integer
          minimum: 1
          description: 会话编辑 version(CAS 依据);首次接受=1;纯字幕切换+1;seek/重建音轨+1; heartbeat/ready/playing 转换和 renew 不递增。
        generation:
          type: integer
          minimum: 1
          description: 会话编辑代次;首次接受=1;seek/重建音轨(需新输出的换轨)+1;旧代次票立即失效。
        desiredPaused:
          type: boolean
          description: 服务器保留的暂停意图(NOT NULL,默认 false);heartbeat.paused 更新; seek/换轨从服务器读取并保留(seek 保留暂停意图,换轨后同样恢复)。
        delivery:
          $ref: '#/components/schemas/B004PlaybackDelivery'
        positionSeconds:
          type: number
          minimum: 0
          description: 当前/目标播放位置(影片逻辑时间,秒);有限非 NaN,≥0 且不越 duration; seek/换轨响应中为目标位置。
        durationSeconds:
          type:
            - number
            - 'null'
          minimum: 0
          description: 影片逻辑时长(秒,原影片逻辑时间);直播为 null 且不提供影片 seek。
        timelineOffsetSeconds:
          type: number
          description: 转换 manifest 本地时间加该偏移对应影片逻辑时间;seek/换轨响应返回新 offset; direct/未转换时由服务端给出(通常为 0)。
        presentationStartSeconds:
          type: number
          minimum: 0
          description: 指定需要跳过的目标前区间(秒);播放器不展示目标之前的画面。
        ticketExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 当前票过期时间;除 renew 响应外为 null。
        playbackUrl:
          type:
            - string
            - 'null'
          description: >-
            会话化播放地址(同源相对路径,含 opaque ticket query,无源地址); 除 renew 响应外为 null;不得写入 localStorage 或审计日志,页面不向第三方发送
            referrer。
        tracks:
          $ref: '#/components/schemas/B004PlaybackTracks'
        failureCode:
          type: string
          description: >-
            公开稳定失败码;仅 state=failed 时出现且非空(data-model:失败码仅 failed 非空), 如 PLAYBACK_FORMAT_UNSUPPORTED /
            PLAYBACK_RESOURCE_UNAVAILABLE / PLAYBACK_PERFORMANCE_INSUFFICIENT / PLAYBACK_STORAGE_LIMIT /
            PLAYBACK_PREPARE_TIMEOUT / PLAYBACK_SEEK_TIMEOUT;不含源诊断。
        startBasis:
          type: string
          enum:
            - beginning
            - target_history
            - transition_carry
          description: >-
            010 扩展（2026-10-30）：本次起播依据；intent.positionMode 映射唯一 startBasis，禁止第二次 resume 读取覆盖
            carry。权威定义见 docs/specs/010-online-vod/contracts/openapi.yaml。
        resumeDisposition:
          type: string
          enum:
            - pending
            - resume
            - beginning
          description: 010 扩展（2026-10-30）：preparing 未冻结=pending；probe 后一次计算并冻结。
        resumeReason:
          type:
            - string
            - 'null'
          enum:
            - accepted
            - requested_beginning
            - no_history
            - content_changed
            - continuity_changed
            - duration_changed
            - completed
            - invalid_position
            - duration_unknown
            - null
          description: 010 扩展（2026-10-30）：降级从头时给出具体原因；旧历史保留直到新的有效 started。
        transitionSlot:
          type: object
          additionalProperties: false
          description: >-
            010 扩展（2026-10-30）：供当前归属设备恢复/替换；首次槽不存在 revision=0/open（传输初值），持久行
            revision>=1。
          required:
            - revision
            - status
            - activeIntentId
            - successorSessionId
          properties:
            revision:
              type: integer
              minimum: 0
            status:
              type: string
              enum:
                - open
                - reserved
                - consumed
            activeIntentId:
              type:
                - string
                - 'null'
              format: uuid
            successorSessionId:
              type:
                - string
                - 'null'
              format: uuid
        seekCapability:
          type: string
          enum:
            - none
            - client
            - server_rebuild
          description: >-
            010 扩展（2026-10-30）：由可信 probe/交付与可用 seek 范围产生；hls_proxy VOD 第一期仅 client 或 none，直播
            none；client 仅为许可声明，前端还须检查实际 seekable 范围。
        playbackStarted:
          type: boolean
          description: >-
            010 扩展（2026-10-30）：独立 playback_started_at 已设置；仅解除 readyAt+60s 未起播回收期限，与
            sessionStarted/saved/completed 分别记录。
    B004TicketReply:
      type: object
      description: >-
        播放凭据回复(仅 renew 成功返回):URL 携带 opaque ticket,访问日志必须去掉 ticket, 页面不向第三方发送 referrer;URL 不得写入 localStorage
        或审计日志。 默认 5 分钟 TTL(可配置),首次 ready 后立即申请,以后到期前 60 秒续期。
      additionalProperties: false
      required:
        - playbackUrl
        - ticketExpiresAt
        - generation
      properties:
        playbackUrl:
          type: string
          minLength: 1
          description: 会话化播放地址:同源相对路径 /api/playback/stream/{sessionId}/{generation}/…?ticket=…, 不含源地址/上游凭据;绑定设备会话与播放会话。
        ticketExpiresAt:
          type: string
          format: date-time
          description: 票过期时间(默认签发后 5 分钟,可配置;旧票仍按原有效期失效)。
        generation:
          type: integer
          minimum: 1
          description: 签发时的会话代次;客户端须与本地 operationEpoch 匹配后才可安装响应。
    B004PlaybackRecordPage:
      type: object
      description: 设备维度播放记录页(FR-007):session 与 failure 事件混合,按时间/id 倒序; 所有项不含源位置、文件路径或 ticket。
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/B004PlaybackRecordItem'
        nextCursor:
          type:
            - string
            - 'null'
          description: 不透明游标;null 表示没有更多记录。
    B004PlaybackRecordItem:
      description: 播放记录项:播放会话记录或解析失败事件(kind 判别)。
      oneOf:
        - $ref: '#/components/schemas/B004PlaybackSessionRecord'
        - $ref: '#/components/schemas/B004PlaybackFailureRecord'
      discriminator:
        propertyName: kind
        mapping:
          session: '#/components/schemas/B004PlaybackSessionRecord'
          failure: '#/components/schemas/B004PlaybackFailureRecord'
    B004PlaybackSessionRecord:
      type: object
      description: 播放会话记录(FR-007):设备/档案/媒体/所选资源/开始/结束或失败时间/稳定失败码; 仅含脱敏字段,无源位置与 ticket。
      additionalProperties: false
      required:
        - kind
        - id
        - deviceId
        - mediaId
        - profileId
        - state
        - delivery
        - positionSeconds
        - createdAt
        - startedAt
        - endedAt
        - failureCode
        - playbackSourceId
      properties:
        kind:
          type: string
          enum:
            - session
        id:
          type: string
          format: uuid
          description: 播放会话 ID。
        deviceId:
          type: string
          format: uuid
          description: 设备 ID(查询路径的设备)。
        mediaId:
          type: string
          format: uuid
          description: 媒体 ID(当前家庭内)。
        profileId:
          type: string
          format: uuid
          description: 发起播放时的当前档案 ID。
        state:
          $ref: '#/components/schemas/B004PlaybackSessionState'
        delivery:
          $ref: '#/components/schemas/B004PlaybackDelivery'
        positionSeconds:
          type: number
          minimum: 0
          description: 记录时点的播放位置(影片逻辑时间,秒)。
        createdAt:
          type: string
          format: date-time
          description: 请求被接受时间(UTC ISO8601)。
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 首次媒体交付时间;可能永不发生(为 null)。
        endedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: 结束时间;ended/failed/interrupted 终态必填,活动态为 null。
        failureCode:
          type:
            - string
            - 'null'
          description: 公开稳定失败码;仅 failed 非空,其余为 null;无源诊断。
        playbackSourceId:
          type:
            - string
            - 'null'
          format: uuid
          description: 所选播放资源的不透明标识(data-model playback_source_id;nullable, 准备阶段候选未固定/准备失败时为 null);仅为标识,不含源位置/路径/上游凭据。
    B004PlaybackFailureRecord:
      type: object
      description: 解析失败事件(FR-007):有效设备会话的被拒解析另记失败事件,不建立播放会话; 不与异步准备失败(probe/转换,记录在已建立会话)混淆;不可见媒体不记录其标识。
      additionalProperties: false
      required:
        - kind
        - id
        - occurredAt
        - stableCode
        - profileId
        - mediaId
      properties:
        kind:
          type: string
          enum:
            - failure
        id:
          type: string
          format: uuid
          description: 失败事件 ID。
        occurredAt:
          type: string
          format: date-time
          description: 发生时间(UTC ISO8601)。
        stableCode:
          type: string
          description: 公开稳定失败码;无源诊断。
        profileId:
          type:
            - string
            - 'null'
          format: uuid
          description: 可确定的档案 ID;未选择档案时为 null。
        mediaId:
          type:
            - string
            - 'null'
          format: uuid
          description: 关联媒体 ID;仅可见媒体可关联,不可见媒体为 null(不存客户端原始目标 ID)。
    Problem:
      type: object
      additionalProperties: false
      properties:
