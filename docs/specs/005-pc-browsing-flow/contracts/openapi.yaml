    CurrentNextProjection:
      type: object
      description: >-
        频道当前/下一档排期投影(016 data-model §2.3);批量接口按 mediaId 映射返回。
        matchMode=none 时 current/next/epgSourceId 均为 null,频道仍可正常播放。
      additionalProperties: false
      properties:
        current:
          description: 当前播出节目;无排期为 null。
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  description: 不透明节目标识(SHA-256);不含上游频道/节目 ID。
                title:
                  type: string
                  description: 节目标题(如"新闻联播")。
                start:
                  type: string
                  format: date-time
                  description: 开播时间(UTC ISO8601)。
                end:
                  type: string
                  format: date-time
                  description: 结束时间(UTC ISO8601)。
                progress:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: 当前进度(0.00~1.00)。
              required:
                - key
                - title
                - start
                - end
                - progress
            - type: 'null'
        next:
          description: 下一档节目;无排期为 null。
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  description: 不透明节目标识(SHA-256);不含上游频道/节目 ID。
                title:
                  type: string
                  description: 节目标题。
                start:
                  type: string
                  format: date-time
                  description: 开播时间(UTC ISO8601)。
                end:
                  type: string
                  format: date-time
                  description: 结束时间(UTC ISO8601)。
              required:
                - key
                - title
                - start
                - end
            - type: 'null'
        epgSourceId:
          description: 本次命中排期的 EPG 源 ID(级联裁决诊断用);未命中为 null。
          type:
            - string
            - 'null'
        matchMode:
          type: string
          enum:
            - manual
            - precise
            - cascade
            - alias
            - none
          description: >-
            排期命中方式:manual 手动绑定 > precise tvg-id 精确 > cascade 多源级联 >
            alias 归一化/别名 > none 未命中。
      required:
        - current
        - next
        - epgSourceId
        - matchMode
    NowPlayingPage:
      type: object
      description: >-
        批量当前/下一档节目投影响应(016 api.md §1.1);programmes 以 mediaId 为键,
        仅含请求(或缺省时家庭可用)范围内的频道;无排期频道同样返回 null 投影而非缺键,
        便于前端按固定键集合渲染。
      additionalProperties: false
      properties:
        now:
          type: string
          format: date-time
          description: Server time frozen for this response; independent requests may have different instants.
        programmes:
          type: object
          description: 以 mediaId 为键的当前/下一档投影映射。
          additionalProperties:
            $ref: '#/components/schemas/CurrentNextProjection'
      required:
        - now
        - programmes
    EpgSourcePriority:
      type: object
      description: >-
        已启用 EPG 源的优先级视图(016 api.md §3.1);级联匹配 Level 3 按 priority ASC
        (数值越小越优先)遍历;管理端点仅主管理员可见(ADR-0017),此组件为其响应元素。
      additionalProperties: false
      properties:
        sourceId:
          type: string
          description: EPG 来源标识(目录 Source ID,不透明)。
        name:
          type: string
          description: 来源显示名称(如"官方 XMLTV")。
        priority:
          type: integer
          minimum: 0
          description: 优先级权重;数值越小越优先(priority ASC)。
        channelCount:
          type: integer
          minimum: 0
          description: 该源参与匹配的频道数量。
        lastSyncAt:
          description: 最近一次同步完成时间;尚未同步为 null。
          type:
            - string
            - 'null'
          format: date-time
      required:
        - sourceId
        - name
        - priority
        - channelCount
        - lastSyncAt
    GuideWindow:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
        now:
          type: string
          format: date-time
        allowedDates:
          type: array
          items:
            type: string
            format: date
          minItems: 7
          maxItems: 7
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
